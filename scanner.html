<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Pro - SoccerStats Parser</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .result-card { transition: all 0.3s ease; }
        .result-card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-emerald-400 mb-2">⚽ SCANNER PRO</h1>
            <p class="text-slate-400">Análisis Avanzado de Goles y BTTS</p>
        </header>

        <div class="bg-slate-800 rounded-xl p-6 shadow-2xl mb-8">
            <label class="block text-sm font-medium mb-2 text-emerald-300">Pegar datos RAW de SoccerStats:</label>
            <textarea 
                id="rawData" 
                class="w-full h-64 bg-slate-700 border border-slate-600 rounded-lg p-4 text-xs font-mono focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                placeholder="Country | 3.5+ | 2.5+ | 1.5+ | GA | GF | TG | PPG | GP | scope | equipo | hora | rival..."></textarea>
            
            <button 
                onclick="processData()"
                class="mt-4 w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition-colors shadow-lg uppercase tracking-wider">
                Procesar y Filtrar Partidos
            </button>
        </div>

        <div id="results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>
    </div>

    <script>
        function processData() {
            const rawText = document.getElementById('rawData').value;
            const resultsContainer = document.getElementById('results');
            resultsContainer.innerHTML = '';

            if (!rawText.trim()) return;

            const rows = rawText.split('\n').filter(row => row.trim() !== '');
            let filteredMatches = [];

            rows.forEach(row => {
                const cols = row.split('\t').map(c => c.trim());
                
                if (cols.length < 20 || cols[0].toLowerCase().includes('country')) return;

                try {
                    const matchObj = {
                        league: cols[0], // Extrae el País/Liga del inicio de la fila
                        homeName: cols[10],
                        awayName: cols[12],
                        time: cols[11] || "23:59",
                        home: {
                            over35: parseFloat(cols[1]) || 0,
                            over25: parseFloat(cols[2]) || 0,
                            over15: parseFloat(cols[3]) || 0,
                            GA: parseFloat(cols[4]) || 0,
                            GF: parseFloat(cols[5]) || 0,
                            TG: parseFloat(cols[6]) || 0,
                            ppg: parseFloat(cols[7]) || 0
                        },
                        away: {
                            GA: parseFloat(cols[18]) || 0,
                            GF: parseFloat(cols[17]) || 0, 
                            TG: parseFloat(cols[16]) || 0,
                            over15: parseFloat(cols[19]) || 0,
                            over25: parseFloat(cols[20]) || 0,
                            over35: parseFloat(cols[21]) || 0,
                            ppg: parseFloat(cols[15]) || 0
                        }
                    };

                    if (matchObj.homeName && matchObj.awayName) {
                        matchObj.tips = applyFilters(matchObj);
                        
                        if (matchObj.tips.length > 0) {
                            filteredMatches.push(matchObj);
                        }
                    }
                } catch (e) {
                    console.error("Error parseando fila:", e);
                }
            });

            // Ordenar por horario (HH:mm)
            filteredMatches.sort((a, b) => a.time.localeCompare(b.time));

            renderMatches(filteredMatches);
        }

        function applyFilters(m) {
            const tips = [];
            
            // --- LÓGICA OVER 2.5 PRO ---
            const avgTG = (m.home.TG + m.away.TG) / 2;
            const condOver25 = 
                avgTG >= 2.8 &&
                m.home.over25 >= 55 && m.away.over25 >= 55 &&
                (m.home.GF >= 1.5 || m.away.GF >= 1.5) &&
                (m.home.GA >= 1.2 || m.away.GA >= 1.2);

            const avoidOver25 = 
                m.home.TG < 2.3 || m.away.TG < 2.3 ||
                m.home.over25 < 45 || m.away.over25 < 45;

            if (condOver25 && !avoidOver25) {
                tips.push({ type: "OVER 2.5", color: "emerald" });
            }

            // --- LÓGICA BTTS PRO ---
            const diffPPG = Math.abs(m.home.ppg - m.away.ppg);
            const condBTTS = 
                m.home.GF >= 1.2 && m.away.GF >= 1.2 &&
                m.home.GA >= 1.0 && m.away.GA >= 1.0 &&
                m.home.over15 >= 75 && m.away.over15 >= 75 &&
                avgTG >= 2.6 &&
                diffPPG <= 0.8;

            if (condBTTS) {
                tips.push({ type: "BTTS", color: "cyan" });
            }

            return tips;
        }

        function renderMatches(matches) {
            const container = document.getElementById('results');
            
            if (matches.length === 0) {
                container.innerHTML = '<p class="col-span-full text-center text-slate-500 italic">No hay partidos que cumplan los criterios PRO.</p>';
                return;
            }

            matches.forEach(m => {
                const card = document.createElement('div');
                card.className = 'result-card bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-lg flex flex-col';
                
                let tipsHTML = m.tips.map(tip => `
                    <span class="px-3 py-1 rounded-full text-[10px] font-bold bg-${tip.color}-500/20 text-${tip.color}-400 border border-${tip.color}-500/50">
                        ${tip.type}
                    </span>
                `).join('');

                card.innerHTML = `
                    <div class="p-4 border-b border-slate-700 bg-slate-800/50">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <span class="block text-[10px] text-emerald-500 font-bold uppercase tracking-wider">${m.league}</span>
                                <span class="text-xs text-slate-400 font-mono font-bold bg-slate-900 px-2 py-1 rounded inline-block mt-1">${m.time}</span>
                            </div>
                            <div class="flex flex-col gap-1 items-end">${tipsHTML}</div>
                        </div>
                        <h3 class="font-bold text-sm text-center uppercase tracking-tight">
                            ${m.homeName} <span class="text-emerald-500 text-xs italic">vs</span> ${m.awayName}
                        </h3>
                    </div>
                    <div class="p-4 grid grid-cols-2 gap-4 text-center grow">
                        <div class="bg-slate-900/30 rounded p-2">
                            <p class="text-[10px] text-slate-500 uppercase font-bold mb-1">Local (TG / PPG)</p>
                            <p class="text-sm font-mono">${m.home.TG.toFixed(2)} / ${m.home.ppg.toFixed(2)}</p>
                            <p class="text-[10px] text-slate-500 mt-2 uppercase italic">Over 2.5</p>
                            <p class="text-sm font-bold ${m.home.over25 >= 60 ? 'text-emerald-400' : 'text-slate-300'}">${m.home.over25}%</p>
                        </div>
                        <div class="bg-slate-900/30 rounded p-2">
                            <p class="text-[10px] text-slate-500 uppercase font-bold mb-1">Visita (TG / PPG)</p>
                            <p class="text-sm font-mono">${m.away.TG.toFixed(2)} / ${m.away.ppg.toFixed(2)}</p>
                            <p class="text-[10px] text-slate-500 mt-2 uppercase italic">Over 2.5</p>
                            <p class="text-sm font-bold ${m.away.over25 >= 60 ? 'text-emerald-400' : 'text-slate-300'}">${m.away.over25}%</p>
                        </div>
                    </div>
                    <div class="bg-slate-900/80 p-2 text-center border-t border-slate-700/50">
                         <span class="text-[10px] text-emerald-500/80 font-mono font-bold tracking-widest uppercase">
                            Promedio Goles: ${((m.home.TG + m.away.TG) / 2).toFixed(2)}
                         </span>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
