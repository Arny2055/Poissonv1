<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner BetAGS - Detección de Oportunidades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-area:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: #1e293b; }
        textarea::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <header class="max-w-6xl mx-auto mb-10 text-center">
        <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-2">
            Scanner de Partidos - BetAGS
        </h1>
        <p class="text-slate-400 text-lg mb-6">Analizador Inteligente de Texto RAW (SoccerStats / FootyStats)</p>
        
        <nav class="flex flex-wrap justify-center gap-3">
            <a href="data.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg transition border border-slate-700 text-sm">
                <i class="fas fa-database mr-2"></i>Data
            </a>
            <a href="goles.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg transition border border-slate-700 text-sm">
                <i class="fas fa-chart-line mr-2"></i>Poisson O/U
            </a>
            <a href="btts.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg transition border border-slate-700 text-sm">
                <i class="fas fa-exchange-alt mr-2"></i>Modelo BTTS
            </a>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <section class="lg:col-span-5 space-y-6">
            <div class="glass-card p-6 rounded-2xl shadow-xl">
                <label class="block text-sm font-semibold text-blue-400 uppercase tracking-wider mb-3">
                    <i class="fas fa-paste mr-2"></i>Pegar Datos RAW (Sin Limpiar)
                </label>
                <textarea 
                    id="scannerInput" 
                    class="w-full h-96 bg-slate-900/50 border border-slate-700 rounded-xl p-4 text-xs font-mono text-emerald-100 focus:outline-none input-area transition-all"
                    placeholder="Pega aquí el contenido copiado de la web..."></textarea>
                
                <button 
                    onclick="ejecutarScanner()" 
                    class="w-full mt-6 py-4 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold rounded-xl shadow-lg transform active:scale-95 transition-all">
                    <i class="fas fa-bolt mr-2"></i>ESCANEAR Y DETECTAR
                </button>
            </div>
        </section>

        <section class="lg:col-span-7">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold text-slate-200">Resultados del Análisis</h2>
                <span id="matchCount" class="bg-blue-900/40 text-blue-400 px-3 py-1 rounded-full text-xs font-bold border border-blue-800">0 Partidos</span>
            </div>
            
            <div id="scannerResults" class="grid grid-cols-1 gap-4">
                <div class="flex flex-col items-center justify-center h-64 text-slate-600 border-2 border-dashed border-slate-800 rounded-2xl">
                    <i class="fas fa-search text-4xl mb-3"></i>
                    <p>Esperando datos para analizar...</p>
                </div>
            </div>
        </section>

    </main>

    <script>
        /**
         * 1. PARSER INTELIGENTE: Extrae datos de texto sucio
         */
        function parseScannerInput(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const detectedMatches = [];
            const timeRegex = /^([01]?[0-9]|2[0-3]):[0-5][0-9]$/;

            for (let i = 0; i < lines.length; i++) {
                // Detectar patrón: [Equipo A] -> [Hora] -> [Equipo B]
                if (lines[i+1] && timeRegex.test(lines[i+1]) && lines[i+2]) {
                    let matchObj = {
                        match: `${lines[i]} vs ${lines[i+2]}`,
                        home: null,
                        away: null
                    };

                    // Buscar datos de "home" y "away" en las siguientes 20 líneas
                    for (let j = i; j < Math.min(i + 20, lines.length); j++) {
                        const lineLower = lines[j].toLowerCase();
                        const numbers = lines[j].match(/\d+(\.\d+)?/g);

                        if (numbers && numbers.length >= 4) {
                            const data = {
                                over25: parseFloat(numbers[1]) || 0,
                                GA: parseFloat(numbers[3]) || 0,
                                GF: parseFloat(numbers[4]) || 0,
                                TG: parseFloat(numbers[5]) || 0
                            };

                            if (lineLower.includes('home')) matchObj.home = data;
                            if (lineLower.includes('away')) matchObj.away = data;
                        }
                    }

                    if (matchObj.home && matchObj.away) {
                        detectedMatches.push(matchObj);
                        console.log("Partido detectado:", matchObj);
                        i += 2; // Saltar nombres y hora
                    }
                }
            }
            return detectedMatches;
        }

        /**
         * 2. SCORING (Reglas solicitadas)
         */
        function evaluarPartidoStats(data) {
            let score = 0;
            const avgTG = (data.home.TG + data.away.TG) / 2;
            const avgOver25 = (data.home.over25 + data.away.over25) / 2;

            if (avgTG > 3) score += 3;
            else if (avgTG > 2.7) score += 2;
            else if (avgTG > 2.5) score += 1;

            if (avgOver25 > 65) score += 2;
            else if (avgOver25 > 55) score += 1;

            if (data.home.GF > 1.5) score += 1;
            if (data.away.GF > 1.2) score += 1;
            if (data.home.GA > 1.2) score += 1;
            if (data.away.GA > 1.2) score += 1;

            return score;
        }

        function generarSugerenciaScanner(score) {
            if (score >= 6) return { tipo: "OVER 2.5", color: "text-emerald-400", bg: "bg-emerald-500/10", border: "border-emerald-500/50", nivel: "ALTO" };
            if (score >= 5) return { tipo: "BTTS", color: "text-amber-400", bg: "bg-amber-500/10", border: "border-amber-500/50", nivel: "MEDIO" };
            return { tipo: "RIESGO", color: "text-slate-400", bg: "bg-slate-500/10", border: "border-slate-500/50", nivel: "BAJO" };
        }

        /**
         * 3. FUNCIÓN PRINCIPAL
         */
        function ejecutarScanner() {
            const rawText = document.getElementById('scannerInput').value;
            if (!rawText.trim()) return;

            const partidos = parseScannerInput(rawText);
            const resultados = partidos.map(p => {
                const score = evaluarPartidoStats(p);
                const sugerencia = generarSugerenciaScanner(score);
                return { ...p, score, ...sugerencia };
            });

            renderResultados(resultados);
        }

        /**
         * 4. RENDER
         */
        function renderResultados(lista) {
            const container = document.getElementById('scannerResults');
            const counter = document.getElementById('matchCount');
            
            counter.innerText = `${lista.length} Partidos`;
            container.innerHTML = '';

            if (lista.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-64 text-slate-600 border-2 border-dashed border-slate-800 rounded-2xl text-center p-4">
                        <i class="fas fa-exclamation-circle text-4xl mb-3 text-rose-500"></i>
                        <p>No se detectaron bloques de partidos válidos.</p>
                        <p class="text-xs mt-1">Pega el bloque completo incluyendo equipos y estadísticas.</p>
                    </div>`;
                return;
            }

            lista.forEach(item => {
                let estrellas = '';
                const starCount = Math.min(Math.max(Math.floor(item.score / 1.5), 1), 5);
                for (let i = 0; i < 5; i++) {
                    estrellas += i < starCount ? '<i class="fas fa-star text-yellow-500 text-[10px]"></i>' : '<i class="far fa-star text-slate-700 text-[10px]"></i>';
                }

                container.innerHTML += `
                    <div class="glass-card p-5 rounded-2xl border-l-4 ${item.border} flex flex-col md:flex-row items-center justify-between gap-4 transition-all hover:bg-slate-800/80">
                        <div>
                            <h3 class="font-bold text-white text-lg">${item.match}</h3>
                            <div class="flex items-center gap-2 mt-1">
                                <div class="flex gap-0.5">${estrellas}</div>
                                <span class="text-[10px] font-bold text-slate-500 uppercase ml-2 tracking-widest">Score: ${item.score}</span>
                            </div>
                        </div>
                        <div class="text-center md:text-right">
                            <div class="px-5 py-2 ${item.bg} ${item.color} rounded-lg border ${item.border} font-black text-xs tracking-widest">
                                ${item.tipo}
                            </div>
                            <span class="text-[9px] font-bold text-slate-500 uppercase mt-1 block">Nivel ${item.nivel}</span>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
