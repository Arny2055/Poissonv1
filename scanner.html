<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Pro - BetAGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-border:focus { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-4">

    <header class="max-w-6xl mx-auto mb-8 text-center">
        <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-emerald-400">
            BETAGS ADVANCED SCANNER
        </h1>
        <p class="text-slate-400 mt-2">Parser Inteligente con Filtros PRO (Over 2.5 / BTTS)</p>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <section class="lg:col-span-5 space-y-4">
            <div class="glass-card p-5 rounded-3xl shadow-2xl">
                <div class="flex justify-between items-center mb-4">
                    <label class="text-xs font-bold text-cyan-400 uppercase tracking-widest">Entrada de Datos RAW</label>
                    <button onclick="document.getElementById('scannerInput').value=''" class="text-slate-500 hover:text-rose-400 text-xs transition">Limpiar</button>
                </div>
                <textarea 
                    id="scannerInput" 
                    class="w-full h-[500px] bg-slate-900/80 border border-slate-700 rounded-2xl p-4 text-[11px] font-mono text-cyan-100 focus:outline-none neon-border transition-all"
                    placeholder="Pega aquí el contenido directamente de la web..."></textarea>
                
                <button 
                    onclick="ejecutarScanner()" 
                    class="w-full mt-4 py-4 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-black rounded-2xl shadow-lg transform active:scale-95 transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-bolt"></i> PROCESAR Y FILTRAR
                </button>
            </div>
        </section>

        <section class="lg:col-span-7">
            <div class="flex items-center justify-between mb-4 px-2">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fas fa-microscope text-cyan-400"></i> Oportunidades Filtradas
                </h2>
                <span id="matchCount" class="bg-cyan-500/20 text-cyan-400 px-3 py-1 rounded-full text-xs font-black border border-cyan-500/30">0</span>
            </div>
            
            <div id="scannerResults" class="space-y-4 h-[650px] overflow-y-auto pr-2 custom-scrollbar">
                <div class="flex flex-col items-center justify-center h-full text-slate-600 border-2 border-dashed border-slate-800 rounded-3xl">
                    <i class="fas fa-terminal text-4xl mb-4"></i>
                    <p class="text-sm">Esperando datos para aplicar filtros PRO...</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        function extractStatsFromNumbers(numbers) {
            const n = numbers.map(num => parseFloat(num.toString().replace('%', '')));
            return {
                over15: n[0] || 0,
                over25: n[1] || 0,
                over35: n[2] || 0,
                GA: n[3] || 0,
                GF: n[4] || 0,
                TG: n[5] || 0,
                ppg: n[6] || 0
            };
        }

        function parseScannerInput(text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0 && !/^(Country|scope|GP|PPG|TG|GF|GA|1.5|2.5|3.5)/i.test(line));
            const matches = [];
            const timeRegex = /^([01]?[0-9]|2[0-3]):[0-5][0-9]$/;
            let tempStats = null;

            for (let i = 0; i < lines.length; i++) {
                const numbers = lines[i].match(/\d+(\.\d+)?%?/g);
                if (numbers && numbers.length >= 4) {
                    tempStats = extractStatsFromNumbers(numbers);
                }

                if (timeRegex.test(lines[i])) {
                    let homeName = lines[i-1];
                    let awayName = lines[i+1];
                    
                    if (homeName && awayName) {
                        let matchData = { match: `${homeName} vs ${awayName}`, home: tempStats, away: null };
                        for (let j = i; j < Math.min(i + 15, lines.length); j++) {
                            const nextNumbers = lines[j].match(/\d+(\.\d+)?%?/g);
                            if (nextNumbers && nextNumbers.length >= 5 && lines[j] !== lines[i]) {
                                matchData.away = extractStatsFromNumbers(nextNumbers);
                                break;
                            }
                        }
                        if (matchData.home && matchData.away) matches.push(matchData);
                    }
                }
            }
            return matches;
        }

        /**
         * FILTROS PRO (Over 2.5 y BTTS)
         */
        function aplicarFiltrosPro(data) {
            const avgTG = (data.home.TG + data.away.TG) / 2;
            const diffPPG = Math.abs(data.home.ppg - data.away.ppg);
            let picks = [];

            // --- FILTRO PRO (Over 2.5) ---
            const condOver = 
                avgTG >= 2.8 &&
                data.home.over25 >= 55 && data.away.over25 >= 55 &&
                (data.home.GF >= 1.5 || data.away.GF >= 1.5) &&
                (data.home.GA >= 1.2 || data.away.GA >= 1.2);

            const evitarOver = 
                data.home.TG < 2.3 || data.away.TG < 2.3 ||
                data.home.over25 < 45 || data.away.over25 < 45;

            if (condOver && !evitarOver) picks.push({ type: "OVER 2.5", color: "emerald" });

            // --- FILTRO PRO (BTTS) ---
            const condBTTS = 
                data.home.GF >= 1.2 && data.away.GF >= 1.2 &&
                data.home.GA >= 1.0 && data.away.GA >= 1.0 &&
                data.home.over15 >= 75 && data.away.over15 >= 75 &&
                avgTG >= 2.6 &&
                diffPPG <= 0.8;

            if (condBTTS) picks.push({ type: "BTTS", color: "cyan" });

            return picks;
        }

        function ejecutarScanner() {
            const input = document.getElementById('scannerInput').value;
            if (!input.trim()) return alert("Pega datos RAW primero");

            const partidos = parseScannerInput(input);
            const container = document.getElementById('scannerResults');
            const counter = document.getElementById('matchCount');
            
            container.innerHTML = '';
            let validMatches = 0;

            partidos.forEach(p => {
                const sugerencias = aplicarFiltrosPro(p);
                
                if (sugerencias.length > 0) {
                    validMatches++;
                    sugerencias.forEach(sug => {
                        container.innerHTML += `
                            <div class="glass-card p-5 rounded-2xl border-l-4 border-${sug.color}-500 hover:scale-[1.01] transition-all">
                                <div class="flex justify-between items-center gap-4">
                                    <div>
                                        <h3 class="text-lg font-bold text-white mb-1">${p.match}</h3>
                                        <div class="flex gap-4 text-[10px] text-slate-400 font-mono">
                                            <span>H: TG ${p.home.TG} | GF ${p.home.GF} | PPG ${p.home.ppg}</span>
                                            <span>A: TG ${p.away.TG} | GF ${p.away.GF} | PPG ${p.away.ppg}</span>
                                        </div>
                                    </div>
                                    <div class="text-right">
                                        <span class="px-4 py-2 bg-${sug.color}-500/10 text-${sug.color}-400 border border-${sug.color}-500/50 rounded-lg font-black text-xs tracking-widest">
                                            ${sug.type} ${sug.type === 'OVER 2.5' ? '🔥' : '🔄'}
                                        </span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }
            });

            if (validMatches === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 mt-10">No hay partidos que cumplan los filtros PRO hoy.</div>`;
            }
            counter.innerText = validMatches;
        }
    </script>
</body>
</html>
