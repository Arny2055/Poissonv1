<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetAGS - Analizador de Over 2.5</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --high: #22c55e;
            --medium: #eab308;
            --low: #ef4444;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        h1 {
            text-align: center;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .input-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            resize: vertical;
            box-sizing: border-box;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button.secondary {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid var(--accent);
        }

        .summary-card span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .summary-card b {
            font-size: 1.5rem;
            color: var(--text-main);
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 1000px;
        }

        th {
            background: #111827;
            padding: 15px;
            font-size: 0.85rem;
            color: var(--text-dim);
            text-transform: uppercase;
            cursor: pointer;
        }

        th:hover {
            color: var(--accent);
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .high { color: var(--high); border: 1px solid var(--high); }
        .medium { color: var(--medium); border: 1px solid var(--medium); }
        .low { color: var(--low); border: 1px solid var(--low); }

        .row-high { background-color: rgba(34, 197, 94, 0.05); }

        /* Estilo para simular Excel */
        .excel-header {
            background: linear-gradient(to bottom, #1e293b, #0f172a);
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            button { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>BetAGS statistical model</h1>

    <div class="input-section">
        <textarea id="rawData" placeholder="Pega aquí los datos de la tabla (incluyendo encabezados)..."></textarea>
        <div class="controls">
            <button onclick="processData()">ANALIZAR PARTIDOS</button>
            <button class="secondary" onclick="sortData('finalProb')">ORDENAR POR PROB %</button>
            <button class="secondary" onclick="sortData('totalXG')">ORDENAR POR xG</button>
            <button class="secondary" onclick="toggleHighValue()">SOLO HIGH VALUE</button>
            <button class="secondary" onclick="clearData()" style="color: #ef4444;">LIMPIAR</button>
        </div>
    </div>

    <div id="summary" class="summary-grid" style="display: none;">
        <div class="summary-card">
            <span>Partidos Analizados</span>
            <b id="countPicks">0</b>
        </div>
        <div class="summary-card">
            <span>Picks HIGH VALUE</span>
            <b id="countHigh" style="color: var(--high);">0</b>
        </div>
        <div class="summary-card">
            <span>Promedio Prob. Final</span>
            <b id="avgProb">0%</b>
        </div>
    </div>

    <div class="table-container">
        <table id="resultTable">
            <thead class="excel-header">
                <tr>
                    <th>País</th>
                    <th>Hora</th>
                    <th>Partido</th>
                    <th>λ H</th>
                    <th>λ A</th>
                    <th>xG Total</th>
                    <th>Poisson %</th>
                    <th>U8 Prom %</th>
                    <th>Final %</th>
                    <th>Edge</th>
                    <th>Clasificación</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    let matchesData = [];
    let showOnlyHigh = false;

    function factorial(n) {
        if (n === 0 || n === 1) return 1;
        let res = 1;
        for (let i = 2; i <= n; i++) res *= i;
        return res;
    }

    function poisson(lambda, k) {
        return (Math.pow(lambda, k) * Math.exp(-lambda)) / factorial(k);
    }

    function calculatePoissonOver25(lH, lA) {
        let probUnder3 = 0;
        // Probabilidades de 0, 1 y 2 goles totales
        // (0,0), (0,1), (1,0), (1,1), (0,2), (2,0)
        const scenarios = [
            [0, 0], [0, 1], [1, 0], [1, 1], [0, 2], [2, 0]
        ];

        scenarios.forEach(s => {
            const pH = poisson(lH, s[0]);
            const pA = poisson(lA, s[1]);
            probUnder3 += (pH * pA);
        });

        return (1 - probUnder3) * 100;
    }

    function processData() {
        const text = document.getElementById('rawData').value.trim();
        if (!text) return;

        const lines = text.split('\n');
        if (lines.length < 1) return;

        // Detectar índices dinámicamente basados en la primera línea o estructura común
        const rows = lines.map(line => line.split('\t'));
        const results = [];

        rows.forEach(cols => {
            if (cols.length < 15) return; // Línea inválida
            if (cols[0].toLowerCase().includes('country')) return; // Cabecera

            try {
                // Asignación basada en la estructura proporcionada por el usuario
                // Country(0), Over2.5_H(2), GA_H(3), GF_H(4), PPG_H(6), TeamH(9), Time(10), TeamA(11), GF_A(15), GA_A(16), Over2.5_A(20)
                
                const country = cols[0];
                const over25_H = parseFloat(cols[2]) || 0;
                const gaH = parseFloat(cols[3]) || 0;
                const gfH = parseFloat(cols[4]) || 0;
                const teamH = cols[9];
                const time = cols[10];
                const teamA = cols[11];
                const gfA = parseFloat(cols[15]) || 0;
                const gaA = parseFloat(cols[16]) || 0;
                const over25_A = parseFloat(cols[20]) || 0;

                // 2. Cálculos Lambdas
                const lambdaH = (gfH + gaA) / 2;
                const lambdaA = (gfA + gaH) / 2;
                const totalXG = lambdaH + lambdaA;

                // 3. Poisson Over 2.5
                const poissonProb = calculatePoissonOver25(lambdaH, lambdaA);

                // 4. Promedio U8
                const u8Avg = (over25_H + over25_A) / 2;

                // 5. Probabilidad Final
                const finalProb = (poissonProb * 0.7) + (u8Avg * 0.3);
                const edge = poissonProb - u8Avg;

                let rank = 'LOW';
                let classColor = 'low';
                if (finalProb >= 65) { rank = '🔥 HIGH VALUE'; classColor = 'high'; }
                else if (finalProb >= 55) { rank = '⚡ MEDIUM'; classColor = 'medium'; }

                results.push({
                    country, time, teamH, teamA, 
                    lambdaH, lambdaA, totalXG, 
                    poissonProb, u8Avg, finalProb, 
                    edge, rank, classColor
                });
            } catch (e) {
                console.error("Error procesando fila:", e);
            }
        });

        matchesData = results;
        renderTable();
        updateSummary();
    }

    function renderTable() {
        const body = document.getElementById('tableBody');
        body.innerHTML = '';

        let filtered = showOnlyHigh ? matchesData.filter(m => m.finalProb >= 65) : matchesData;

        filtered.forEach(m => {
            const row = document.createElement('tr');
            if (m.finalProb >= 65) row.className = 'row-high';

            row.innerHTML = `
                <td>${m.country}</td>
                <td>${m.time}</td>
                <td style="font-weight:bold;">${m.teamH} vs ${m.teamA}</td>
                <td>${m.lambdaH.toFixed(2)}</td>
                <td>${m.lambdaA.toFixed(2)}</td>
                <td style="color:var(--accent); font-weight:bold;">${m.totalXG.toFixed(2)}</td>
                <td>${m.poissonProb.toFixed(1)}%</td>
                <td>${m.u8Avg.toFixed(1)}%</td>
                <td style="font-size:1.1rem; font-weight:800;">${m.finalProb.toFixed(1)}%</td>
                <td style="color:${m.edge >= 0 ? '#22c55e' : '#ef4444'}">${m.edge.toFixed(1)}%</td>
                <td><span class="badge ${m.classColor}">${m.rank}</span></td>
            `;
            body.appendChild(row);
        });
    }

    function updateSummary() {
        if (matchesData.length === 0) return;
        document.getElementById('summary').style.display = 'grid';
        
        const highCount = matchesData.filter(m => m.finalProb >= 65).length;
        const avg = matchesData.reduce((acc, curr) => acc + curr.finalProb, 0) / matchesData.length;

        document.getElementById('countPicks').innerText = matchesData.length;
        document.getElementById('countHigh').innerText = highCount;
        document.getElementById('avgProb').innerText = avg.toFixed(1) + '%';
    }

    function sortData(key) {
        matchesData.sort((a, b) => b[key] - a[key]);
        renderTable();
    }

    function toggleHighValue() {
        showOnlyHigh = !showOnlyHigh;
        renderTable();
    }

    function clearData() {
        document.getElementById('rawData').value = '';
        matchesData = [];
        document.getElementById('tableBody').innerHTML = '';
        document.getElementById('summary').style.display = 'none';
    }
</script>

</body>
</html>
