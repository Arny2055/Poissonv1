<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Poisson Over 2.5 - Multi Partidos</title>
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --accent: #00e676;
            --text-main: #e0e0e0;
            --text-dim: #b0b0b0;
            --border: #333;
            --red: #ff5252;
            --yellow: #ffd740;
            --green: #69f0ae;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 { color: var(--accent); margin-bottom: 10px; }

        .input-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #252525;
            color: var(--accent);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px;
            font-family: monospace;
            resize: vertical;
            box-sizing: border-box;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            background: var(--accent);
            color: black;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        .stats-bar {
            display: flex;
            gap: 20px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent);
        }

        .stat-item { flex: 1; text-align: center; }
        .stat-val { display: block; font-size: 1.2rem; font-weight: bold; color: var(--accent); }
        .stat-label { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; }

        .filter-section {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="number"] {
            background: #252525;
            border: 1px solid var(--border);
            color: white;
            padding: 5px;
            width: 60px;
            border-radius: 4px;
        }

        .table-container {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #2c2c2c;
            padding: 12px;
            font-size: 0.85rem;
            color: var(--text-dim);
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .prob-cell { font-weight: bold; }
        .low { color: var(--red); }
        .med { color: var(--yellow); }
        .high { color: var(--green); }

        tr:hover { background: #252525; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a1a; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Calculadora Poisson Over 2.5</h1>
        <p style="color: var(--text-dim)">Pega los datos directamente desde tu Excel para analizar múltiples partidos</p>
    </header>

    <div class="input-section">
        <textarea id="rawData" placeholder="Pega aquí los datos (Country... GF... GA...)"></textarea>
        <div class="controls">
            <button onclick="processData()">CALCULAR POISSON</button>
            <div class="filter-section">
                <span>Filtrar Over 2.5 ></span>
                <input type="number" id="minProb" value="0" min="0" max="100"> <span>%</span>
            </div>
        </div>
    </div>

    <div id="resultsArea" style="display: none;">
        <div class="stats-bar">
            <div class="stat-item">
                <span id="statTotal" class="stat-val">0</span>
                <span class="stat-label">Partidos</span>
            </div>
            <div class="stat-item">
                <span id="statAvg" class="stat-val">0%</span>
                <span class="stat-label">Promedio Prob.</span>
            </div>
            <div class="stat-item">
                <span id="statBest" class="stat-val">0</span>
                <span class="stat-label">> 60% Prob.</span>
            </div>
        </div>

        <div class="table-container">
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>País</th>
                        <th>Hora</th>
                        <th>Local</th>
                        <th>Visitante</th>
                        <th>λ Local</th>
                        <th>λ Vis</th>
                        <th>Prob. Over 2.5</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    /**
     * LÓGICA DE PROCESAMIENTO
     */
    function processData() {
        const text = document.getElementById('rawData').value.trim();
        const minFilter = parseFloat(document.getElementById('minProb').value) || 0;
        if (!text) return alert("Por favor, pega algunos datos primero.");

        const lines = text.split('\n');
        const results = [];
        let totalProbSum = 0;
        let highProbCount = 0;

        lines.forEach(line => {
            // Dividir por tabulación (formato Excel)
            const cols = line.split('\t').map(c => c.trim());
            
            // Verificación básica de columnas (basado en el formato proporcionado)
            // Local está en index 10, Visitante en index 12 aprox.
            // Extraemos datos según la estructura descrita
            if (cols.length < 15) return; 

            try {
                const pais = cols[0];
                const hora = cols[11] || "--:--";
                const local = cols[10];
                const visitante = cols[12];
                
                // Basado en el formato: GF local (index 5), GA local (index 4)
                // GF visitante (index 15), GA visitante (index 17)
                // Nota: Los índices pueden variar ligeramente según si hay columnas ocultas, 
                // pero calibramos según el ejemplo del prompt.
                const gfL = parseFloat(cols[5]);
                const gaL = parseFloat(cols[4]);
                const gfV = parseFloat(cols[15]);
                const gaV = parseFloat(cols[17]);

                if (isNaN(gfL) || isNaN(gfV)) return;

                // 1. Calcular Lambdas
                const lambdaL = (gfL + gaV) / 2;
                const lambdaV = (gfV + gaL) / 2;

                // 2. Calcular Probabilidad Over 2.5
                const probOver25 = calculateOver25(lambdaL, lambdaV);
                const probPercent = (probOver25 * 100).toFixed(2);

                if (parseFloat(probPercent) >= minFilter) {
                    results.push({
                        pais, hora, local, visitante, 
                        lambdaL: lambdaL.toFixed(2), 
                        lambdaV: lambdaV.toFixed(2), 
                        prob: parseFloat(probPercent)
                    });
                    
                    totalProbSum += parseFloat(probPercent);
                    if (probPercent > 60) highProbCount++;
                }
            } catch (e) {
                console.error("Error procesando fila: ", e);
            }
        });

        renderTable(results);
        updateStats(results.length, totalProbSum, highProbCount);
    }

    /**
     * CÁLCULO DISTRIBUCIÓN POISSON
     * P(k, λ) = (e^-λ * λ^k) / k!
     */
    function poisson(k, lambda) {
        const e = Math.exp(-lambda);
        let factorial = 1;
        for (let i = 1; i <= k; i++) factorial *= i;
        return (Math.pow(lambda, k) * e) / factorial;
    }

    function calculateOver25(l1, l2) {
        // Probabilidades de goles individuales
        const pL = [poisson(0, l1), poisson(1, l1), poisson(2, l1)];
        const pV = [poisson(0, l2), poisson(1, l2), poisson(2, l2)];

        // Probabilidades Under 2.5:
        // 0-0, 1-0, 0-1, 1-1, 2-0, 0-2
        const p00 = pL[0] * pV[0];
        const p10 = pL[1] * pV[0];
        const p01 = pL[0] * pV[1];
        const p11 = pL[1] * pV[1];
        const p20 = pL[2] * pV[0];
        const p02 = pL[0] * pV[2];

        const under25 = p00 + p10 + p01 + p11 + p20 + p02;
        return 1 - under25;
    }

    /**
     * INTERFAZ DE USUARIO
     */
    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        const area = document.getElementById('resultsArea');
        tbody.innerHTML = "";
        area.style.display = "block";

        data.forEach(item => {
            let colorClass = "low";
            if (item.prob > 60) colorClass = "high";
            else if (item.prob >= 50) colorClass = "med";

            const row = `<tr>
                <td>${item.pais}</td>
                <td>${item.hora}</td>
                <td>${item.local}</td>
                <td>${item.visitante}</td>
                <td>${item.lambdaL}</td>
                <td>${item.lambdaV}</td>
                <td class="prob-cell ${colorClass}">${item.prob}%</td>
            </tr>`;
            tbody.innerHTML += row;
        });
    }

    function updateStats(total, sum, high) {
        document.getElementById('statTotal').innerText = total;
        document.getElementById('statAvg').innerText = total > 0 ? (sum / total).toFixed(1) + "%" : "0%";
        document.getElementById('statBest').innerText = high;
    }
</script>

</body>
</html>
