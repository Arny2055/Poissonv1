<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetAGS - Analizador Pro Over 2.5</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --high: #22c55e;
            --medium: #eab308;
            --low: #ef4444;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1300px;
        }

        h1 {
            text-align: center;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-dim);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .input-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }

        textarea {
            width: 100%;
            height: 180px;
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            resize: vertical;
            box-sizing: border-box;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button.secondary {
            background: #334155;
            color: var(--text-main);
            border: 1px solid var(--border);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border);
            border-top: 4px solid var(--accent);
        }

        .summary-card b {
            font-size: 1.8rem;
            color: var(--text-main);
            display: block;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 1100px;
        }

        th {
            background: #111827;
            padding: 15px;
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: 800;
            font-size: 0.7rem;
            display: inline-block;
        }

        .high { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
        .medium { background: rgba(234, 179, 8, 0.2); color: #fde047; border: 1px solid #eab308; }
        .low { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }
    </style>
</head>
<body>

<div class="container">
    <h1>BetAGS Statistical Model</h1>
    <p class="subtitle">Mapeo Corregido: England & Mexico Style</p>

    <div class="input-section">
        <textarea id="rawData" placeholder="Pega los datos aquí..."></textarea>
        <div class="controls">
            <button onclick="processData()">📊 Analizar Partidos</button>
            <button class="secondary" onclick="sortData('finalProb')">🔝 Ordenar Prob</button>
            <button class="secondary" onclick="sortData('totalXG')">⚽ Ordenar xG</button>
            <button class="secondary" onclick="toggleHighValue()" id="btnFilter">🔥 Solo High Value</button>
            <button class="secondary" onclick="clearData()" style="color: #f87171;">🗑️ Limpiar</button>
        </div>
    </div>

    <div id="summary" class="summary-grid" style="display: none;">
        <div class="summary-card"><span>Partidos</span><b id="countPicks">0</b></div>
        <div class="summary-card"><span>High Value</span><b id="countHigh" style="color: var(--high);">0</b></div>
        <div class="summary-card"><span>Promedio</span><b id="avgProb">0%</b></div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>País</th>
                    <th>Hora</th>
                    <th>Partido</th>
                    <th>λ H</th>
                    <th>λ A</th>
                    <th>xG Total</th>
                    <th>Poisson %</th>
                    <th>U8 Prom %</th>
                    <th>Final %</th>
                    <th>Edge</th>
                    <th>Clasificación</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let matchesData = [];
    let showOnlyHigh = false;

    function factorial(n) { return (n <= 1) ? 1 : n * factorial(n - 1); }
    function getPoisson(lambda, k) { return (Math.pow(lambda, k) * Math.exp(-lambda)) / factorial(k); }

    function calculatePoissonOver25(lH, lA) {
        let probUnder3 = 0;
        const scenarios = [[0,0], [1,0], [0,1], [2,0], [0,2], [1,1]];
        scenarios.forEach(([h, a]) => { probUnder3 += (getPoisson(lH, h) * getPoisson(lA, a)); });
        return (1 - probUnder3) * 100;
    }

    function processData() {
        const text = document.getElementById('rawData').value.trim();
        if (!text) return;

        const lines = text.split('\n');
        const results = [];

        lines.forEach(line => {
            if (!line.includes('\t') || line.toLowerCase().includes('country')) return;
            
            const cols = line.split('\t').map(c => c.trim());
            if (cols.length < 15) return;

            try {
                // MAPEO CORREGIDO BASADO EN TU ESTRUCTURA:
                // [0] Country | [2] Over2.5 Home | [3] GA Home | [4] GF Home
                // [9] Home Team | [10] Time | [11] Away Team
                // [15] GF Away | [16] GA Away | [20] Over2.5 Away

                const country = cols[0];
                const over25H = parseFloat(cols[2]) || 0;
                const gaH = parseFloat(cols[3]) || 0;
                const gfH = parseFloat(cols[4]) || 0;
                const teamH = cols[9];
                const time = cols[10];
                const teamA = cols[11];
                const gfA = parseFloat(cols[15]) || 0;
                const gaA = parseFloat(cols[16]) || 0;
                const over25A = parseFloat(cols[20]) || 0;

                const lambdaH = (gfH + gaA) / 2;
                const lambdaA = (gfA + gaH) / 2;
                const totalXG = lambdaH + lambdaA;

                const poissonProb = calculatePoissonOver25(lambdaH, lambdaA);
                const historicalAvg = (over25H + over25A) / 2;
                const finalProb = (poissonProb * 0.7) + (historicalAvg * 0.3);
                const edge = finalProb - historicalAvg;

                let rank = 'LOW';
                let rankClass = 'low';
                if (finalProb >= 65) { rank = '🔥 HIGH'; rankClass = 'high'; }
                else if (finalProb >= 55) { rank = '⚡ MEDIUM'; rankClass = 'medium'; }

                results.push({
                    country, time, teamH, teamA, lambdaH, lambdaA, totalXG,
                    poissonProb, historicalAvg, finalProb, edge, rank, rankClass
                });
            } catch (err) { console.warn(err); }
        });

        matchesData = results;
        renderTable();
        updateSummary();
    }

    function renderTable() {
        const body = document.getElementById('tableBody');
        body.innerHTML = '';
        const data = showOnlyHigh ? matchesData.filter(m => m.finalProb >= 65) : matchesData;

        data.forEach(m => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${m.country}</td>
                <td>${m.time}</td>
                <td><b>${m.teamH} vs ${m.teamA}</b></td>
                <td>${m.lambdaH.toFixed(2)}</td>
                <td>${m.lambdaA.toFixed(2)}</td>
                <td style="color:var(--accent); font-weight:bold;">${m.totalXG.toFixed(2)}</td>
                <td>${m.poissonProb.toFixed(1)}%</td>
                <td>${m.historicalAvg.toFixed(1)}%</td>
                <td style="font-weight:900;">${m.finalProb.toFixed(1)}%</td>
                <td style="color:${m.edge >= 0 ? '#4ade80' : '#f87171'}">${m.edge.toFixed(1)}%</td>
                <td><span class="badge ${m.rankClass}">${m.rank}</span></td>
            `;
            body.appendChild(tr);
        });
    }

    function updateSummary() {
        document.getElementById('summary').style.display = 'grid';
        document.getElementById('countPicks').innerText = matchesData.length;
        document.getElementById('countHigh').innerText = matchesData.filter(m => m.finalProb >= 65).length;
        const avg = matchesData.reduce((acc, curr) => acc + curr.finalProb, 0) / (matchesData.length || 1);
        document.getElementById('avgProb').innerText = avg.toFixed(1) + '%';
    }

    function sortData(key) { matchesData.sort((a, b) => b[key] - a[key]); renderTable(); }
    function toggleHighValue() { showOnlyHigh = !showOnlyHigh; renderTable(); }
    function clearData() { location.reload(); }
</script>
</body>
</html>
