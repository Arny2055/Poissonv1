<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Poisson Over 2.5 - Multi Partidos</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

textarea {
    width: 100%;
    height: 200px;
    background: #111827;
    color: #e5e7eb;
    border: 1px solid #374151;
    padding: 10px;
    border-radius: 6px;
    resize: vertical;
}

.controls {
    margin: 15px 0;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    padding: 10px 15px;
    border: none;
    background: #2563eb;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

input {
    padding: 8px;
    border-radius: 6px;
    border: none;
}

.stats {
    margin: 10px 0;
}

.table-container {
    max-height: 500px;
    overflow-y: auto;
    border: 1px solid #374151;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 8px;
    text-align: center;
    border-bottom: 1px solid #374151;
}

th {
    background: #1f2937;
}

.green { background-color: rgba(34,197,94,0.2); }
.yellow { background-color: rgba(234,179,8,0.2); }
.red { background-color: rgba(239,68,68,0.2); }
</style>
</head>

<body>

<h1>⚽ Calculadora Poisson Over 2.5</h1>

<textarea id="inputData" placeholder="Pega aquí tus partidos..."></textarea>

<div class="controls">
    <button onclick="procesar()">Calcular Poisson</button>
    <label>Filtro Over %:</label>
    <input type="number" id="filtro" value="0">
</div>

<div class="stats">
    <span id="total"></span> | 
    <span id="promedio"></span>
</div>

<div class="table-container">
<table id="tabla">
<thead>
<tr>
<th>País</th>
<th>Hora</th>
<th>Local</th>
<th>Visitante</th>
<th>λ Local</th>
<th>λ Visitante</th>
<th>Over 2.5 %</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<script>

// factorial cache
const factCache = [1];
function factorial(n){
    if(factCache[n]) return factCache[n];
    let res = factCache[factCache.length-1];
    for(let i=factCache.length;i<=n;i++){
        res *= i;
        factCache[i] = res;
    }
    return res;
}

function poisson(k, lambda){
    return Math.exp(-lambda) * Math.pow(lambda, k) / factorial(k);
}

function probOver25(lh, la){
    let total = 0;
    for(let i=0;i<=20;i++){
        for(let j=0;j<=20;j++){
            if(i + j <= 2){
                total += poisson(i, lh) * poisson(j, la);
            }
        }
    }
    return (1 - total);
}

function esNumero(val){
    return !isNaN(val) && val !== "";
}

function procesar(){

    const input = document.getElementById("inputData").value.trim();
    const filas = input.split("\n");
    const tbody = document.querySelector("#tabla tbody");
    const filtro = parseFloat(document.getElementById("filtro").value) || 0;

    tbody.innerHTML = "";

    let totalPartidos = 0;
    let sumaProb = 0;

    for(let fila of filas){

        let cols = fila.split("\t").map(x => x.trim());

        if(cols.length < 20) continue;

        try{

            let pais = cols[0];

            let local = cols[10];
            let hora = cols[11];
            let visitante = cols[12];

            // índices fijos según tu estructura
            let GA_local = parseFloat(cols[4]);
            let GF_local = parseFloat(cols[5]);

            let GF_visit = parseFloat(cols[15]);
            let GA_visit = parseFloat(cols[16]);

            if(![GA_local,GF_local,GF_visit,GA_visit].every(esNumero)) continue;

            let lambda_local = (GF_local + GA_visit) / 2;
            let lambda_visit = (GF_visit + GA_local) / 2;

            let over = probOver25(lambda_local, lambda_visit) * 100;

            if(over < filtro) continue;

            totalPartidos++;
            sumaProb += over;

            let clase = "red";
            if(over > 60) clase = "green";
            else if(over >= 50) clase = "yellow";

            let row = `
                <tr class="${clase}">
                    <td>${pais}</td>
                    <td>${hora}</td>
                    <td>${local}</td>
                    <td>${visitante}</td>
                    <td>${lambda_local.toFixed(2)}</td>
                    <td>${lambda_visit.toFixed(2)}</td>
                    <td>${over.toFixed(2)}%</td>
                </tr>
            `;

            tbody.innerHTML += row;

        }catch(e){
            continue;
        }
    }

    document.getElementById("total").innerText = "Partidos: " + totalPartidos;
    document.getElementById("promedio").innerText = "Promedio Over: " + (totalPartidos ? (sumaProb/totalPartidos).toFixed(2) : 0) + "%";
}

</script>

</body>
</html>
