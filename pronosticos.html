<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pronósticos Guardados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-2xl mx-auto">
        <header class="mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black text-slate-800 uppercase tracking-tighter">Pronósticos</h1>
                <p class="text-xs text-slate-500 font-bold uppercase">Historial del Súper Analizador</p>
            </div>
            <a href="goles.html" class="bg-white border border-slate-200 p-2 rounded-lg shadow-sm text-xs font-bold">⬅ Volver</a>
        </header>

        <button onclick="escanearValorAutomatico()"
        class="mb-4 w-full bg-emerald-600 text-white py-2 rounded-lg font-bold text-sm hover:bg-emerald-700 transition-colors">
        🔥 Escanear Valor Automático
        </button>

        <div id="loading" class="text-center py-10 text-slate-400 italic">Cargando pronósticos...</div>
        
        <div id="pronosticosList" class="space-y-4"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://idugbbdlyirhzgczpbhu.supabase.co'; 
        // Corregido: Limpieza de caracteres extra en la clave
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkdWdiYmRseWlyaHpnY3pwYmh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NDQwNTQsImV4cCI6MjA5MTUyMDA1NH0.hK5A-F6TqzlSd6tc7adVptT6xbJN6lPscnJ1xHlzhFk'; 
        
        // Añadida persistencia de sesión para evitar el mensaje de "Debes iniciar sesión"
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: true }
        });

        const ODDS_API_KEY = '9b56bb17...'; // Tu clave de Odds API

        const LIGA_MAP = {
            'mexico': 'soccer_mexico_mx',
            'spain': 'soccer_spain_la_liga',
            'espana': 'soccer_spain_la_liga',
            'england': 'soccer_epl',
            'inglaterra': 'soccer_epl',
            'premier': 'soccer_epl',
            'germany': 'soccer_germany_bundesliga',
            'alemania': 'soccer_germany_bundesliga',
            'italy': 'soccer_italy_serie_a',
            'italia': 'soccer_italy_serie_a',
            'france': 'soccer_france_ligue_1',
            'francia': 'soccer_france_ligue_1',
            'champions': 'soccer_uefa_champions_league',
            'netherlands': 'soccer_netherlands_eredivisie',
            'holanda': 'soccer_netherlands_eredivisie',
            'portugal': 'soccer_portugal_primeira_liga',
            'brazil': 'soccer_brazil_campeonato',
            'brasil': 'soccer_brazil_campeonato'
        };

        function limpiarTexto(texto) {
            if (!texto) return "";
            return texto.toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[^a-z0-9 ]/g, "");
        }

        async function obtenerOdds(partido, ligaOriginal) {
            try {
                let sportKey = 'soccer';
                const ligaBusqueda = limpiarTexto(ligaOriginal || "");
                
                for (const [key, value] of Object.entries(LIGA_MAP)) {
                    if (ligaBusqueda.includes(key)) {
                        sportKey = value;
                        break;
                    }
                }

                const url = `https://api.the-odds-api.com/v4/sports/${sportKey}/odds/?regions=eu&markets=totals&apiKey=${ODDS_API_KEY}`;
                const res = await fetch(url);
                const data = await res.json();

                if (!Array.isArray(data)) return null;

                const nombreLimpio = limpiarTexto(partido);
                const palabrasClave = nombreLimpio.split(" ").filter(p => p.length > 2 && p !== "vs");

                const match = data.find(m => {
                    const home = limpiarTexto(m.home_team);
                    const away = limpiarTexto(m.away_team);
                    return palabrasClave.some(p => home.includes(p) || away.includes(p));
                });

                if (!match) return null;

                let mejorCuota = null;
                let mejorCasa = null;
                const puntoObjetivo = 2.5;
                const tolerancia = 0.01;

                for (const bookmaker of match.bookmakers || []) {
                    const market = bookmaker.markets?.find(m => m.key === "totals");
                    if (!market) continue;

                    if (market.outcomes) {
                        for (const o of market.outcomes) {
                            if (o.name === "Over" && Math.abs(parseFloat(o.point) - puntoObjetivo) < tolerancia) {
                                if (!mejorCuota || o.price > mejorCuota) {
                                    mejorCuota = o.price;
                                    mejorCasa = bookmaker.title;
                                }
                            }
                        }
                    }
                }
                return mejorCuota ? { cuota: mejorCuota, casa: mejorCasa || "Bookmaker" } : null;
            } catch (e) {
                console.error("Error odds:", e);
                return null;
            }
        }

        function calcularEV(probabilidad, cuota) {
            const prob = probabilidad / 100;
            return (prob * cuota) - 1;
        }

        async function loadPronosticos() {
            // Se usa getSession para asegurar que la sesión esté cargada antes de validar
            const { data: { session } } = await _supabase.auth.getSession();
            const user = session?.user;

            if (!user) {
                document.getElementById('loading').innerHTML = `
                    <div class="text-rose-500 font-bold p-4 border border-rose-200 bg-rose-50 rounded-lg">
                        ⚠️ Debes iniciar sesión para ver tus pronósticos.
                    </div>
                `;
                return;
            }

            const { data, error } = await _supabase
                .from('pronosticos')
                .select('*')
                .eq('user_id', user.id)
                .order('fecha', { ascending: false });

            document.getElementById('loading').classList.add('hidden');

            const container = document.getElementById('pronosticosList');
            if (error || !data || data.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400">No hay pronósticos guardados aún.</div>`;
                return;
            }

            data.forEach(p => {
                const prob = parseFloat(p.score);
                const colorScore = prob >= 70 ? 'text-emerald-600' : (prob >= 55 ? 'text-amber-600' : 'text-rose-600');
                
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-xl border border-slate-200 shadow-sm relative overflow-hidden";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${p.liga || 'Liga Desconocida'}</span>
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] text-slate-400">${new Date(p.fecha).toLocaleDateString()}</span>
                            <button onclick="eliminarPronostico('${p.id}')" class="text-rose-400 hover:text-rose-600 text-xs">✕</button>
                        </div>
                    </div>
                    <h3 class="text-lg font-black text-slate-800 leading-tight mb-3">${p.partido}</h3>
                    <div class="flex items-center justify-between border-t pt-3">
                        <div>
                            <p class="text-[10px] uppercase font-bold text-slate-400 tracking-tighter">Probabilidad Over 2.5</p>
                            <p class="text-xl font-black ${colorScore}">${prob}%</p>
                        </div>
                        <div id="valor-${p.id}" class="text-right">
                            <span class="text-[10px] text-slate-400 italic">Esperando escaneo...</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            setTimeout(() => {
                escanearValorAutomatico();
            }, 2000);
        }

        async function guardarValueBet(partido, score, cuota, ev) {
            const { data: { user } } = await _supabase.auth.getUser();
            if (!user) return;

            await _supabase.from('value_bets').upsert([
                {
                    user_id: user.id,
                    partido: partido,
                    probabilidad: score,
                    cuota: cuota,
                    ev: ev,
                    fecha: new Date()
                }
            ], { onConflict: 'partido,user_id' }); // Evita duplicados si tienes una restricción única
        }

        async function escanearValorAutomatico() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (!user) return;

            const { data: pronosticos } = await _supabase
                .from('pronosticos')
                .select('*')
                .eq('user_id', user.id);

            if (!pronosticos) return;

            for (const p of pronosticos) {
                const contenedor = document.getElementById(`valor-${p.id}`);
                if (contenedor) contenedor.innerHTML = `<span class="text-[10px] text-emerald-500 animate-pulse font-bold">Buscando cuota...</span>`;
                
                const dataOdds = await obtenerOdds(p.partido, p.liga);
                
                if (!dataOdds) {
                    if (contenedor) {
                        contenedor.innerHTML = "❌ Cuota no encontrada";
                        contenedor.className = "text-right text-slate-400 text-[10px] font-bold italic";
                    }
                    continue;
                }

                const { cuota, casa } = dataOdds;
                const ev = calcularEV(p.score, cuota);

                if (ev > 0) {
                    await guardarValueBet(p.partido, p.score, cuota, ev);
                    if (contenedor) {
                        contenedor.innerHTML = `🔥 VALUE | ${casa}: ${cuota}<br><span class="text-emerald-600">EV: ${(ev*100).toFixed(2)}%</span>`;
                        contenedor.className = "text-right text-emerald-600 text-xs font-bold leading-tight";
                    }
                } else {
                    if (contenedor) {
                        contenedor.innerHTML = `📊 ${casa}: ${cuota}<br><span class="text-slate-400">EV: ${(ev*100).toFixed(2)}%</span>`;
                        contenedor.className = "text-right text-slate-500 text-[10px] font-bold leading-tight";
                    }
                }
            }
        }

        async function eliminarPronostico(id) {
            if(!confirm("¿Borrar este pronóstico?")) return;
            const { error } = await _supabase.from('pronosticos').delete().eq('id', id);
            if(!error) location.reload();
            else alert("Error al eliminar");
        }

        loadPronosticos();
    </script>
</body>
</html>
