<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pronósticos Guardados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-2xl mx-auto">
        <header class="mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black text-slate-800 uppercase tracking-tighter">Pronósticos</h1>
                <p class="text-xs text-slate-500 font-bold uppercase">Historial del Súper Analizador</p>
            </div>
            <a href="goles.html" class="bg-white border border-slate-200 p-2 rounded-lg shadow-sm text-xs font-bold">⬅ Volver</a>
        </header>

        <div id="loading" class="text-center py-10 text-slate-400 italic">Cargando pronósticos y cuotas reales...</div>
        
        <div id="pronosticosList" class="space-y-4"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://idugbbdlyirhzgczpbhu.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkdWdiYmRseWlyaHpnY3pwYmh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NDQwNTQsImV4cCI6MjA5MTUyMDA1NH0.hK5A-F6TqzlSd6tc7adVptT6xbJN6lPscnJ1xHlzhFk';
        const ODDS_API_KEY = 'TU_API_KEY_AQUI'; // <--- COLOCA TU KEY DE THE ODDS API AQUÍ
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Función para obtener cuotas de la API
        async function fetchLiveOdds() {
            try {
                // Buscamos en los mercados de fútbol (soccer)
                const response = await fetch(`https://api.the-odds-api.com/v4/sports/soccer/odds/?apiKey=${ODDS_API_KEY}&regions=eu&markets=h2h,totals&bookmakers=pinnacle`);
                return await response.json();
            } catch (e) {
                console.error("Error obteniendo Odds:", e);
                return [];
            }
        }

        async function loadPronosticos() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (!user) {
                document.getElementById('loading').textContent = "Debes iniciar sesión.";
                return;
            }

            // Cargamos datos de Supabase y de la API de Odds en paralelo
            const [supabaseRes, liveOdds] = await Promise.all([
                _supabase.from('pronosticos').select('*').eq('user_id', user.id).order('fecha', { ascending: false }),
                fetchLiveOdds()
            ]);

            const { data, error } = supabaseRes;
            document.getElementById('loading').classList.add('hidden');

            const container = document.getElementById('pronosticosList');
            if (error || !data.length) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400">No hay pronósticos guardados aún.</div>`;
                return;
            }

            data.forEach(p => {
                // Intentar encontrar el partido actual en los datos de la API
                // Buscamos coincidencia parcial en el nombre del equipo
                const liveMatch = liveOdds.find(m => 
                    p.partido.includes(m.home_team) || p.partido.includes(m.away_team)
                );

                let realProb = p.score; // Por defecto la de la DB
                let badgeAPI = "";

                if (liveMatch) {
                    // Si el mercado es Over 2.5, buscamos esa cuota en la API
                    const totalsMarket = liveMatch.bookmakers[0]?.markets.find(mk => mk.key === 'totals');
                    const over25 = totalsMarket?.outcomes.find(o => o.name === 'Over' && o.point === 2.5);
                    
                    if (over25) {
                        // Convertir cuota a probabilidad implícita
                        realProb = ((1 / over25.price) * 100).toFixed(1);
                        badgeAPI = `<span class="bg-blue-100 text-blue-700 text-[8px] px-1 rounded ml-1 tracking-normal">LIVE API</span>`;
                    }
                }

                const colorScore = parseFloat(realProb) >= 70 ? 'text-emerald-600' : (parseFloat(realProb) >= 55 ? 'text-amber-600' : 'text-rose-600');
                
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-xl border border-slate-200 shadow-sm relative overflow-hidden";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${p.liga}</span>
                        <span class="text-[10px] text-slate-400">${new Date(p.fecha).toLocaleDateString()}</span>
                    </div>
                    <h3 class="text-lg font-black text-slate-800 leading-tight mb-3">${p.partido}</h3>
                    <div class="grid grid-cols-3 gap-2 mb-4">
                        <div class="text-center bg-slate-50 p-2 rounded">
                            <span class="block text-[8px] font-bold text-slate-500 uppercase">Over 2.5</span>
                            <span class="text-sm font-black text-slate-700">${p.prob_o25}%</span>
                        </div>
                        <div class="text-center bg-slate-50 p-2 rounded">
                            <span class="block text-[8px] font-bold text-slate-500 uppercase">Gol HT</span>
                            <span class="text-sm font-black text-slate-700">${p.prob_ht}%</span>
                        </div>
                        <div class="text-center bg-slate-100 p-2 rounded ring-1 ring-slate-200">
                            <span class="block text-[8px] font-bold text-slate-500 uppercase">Prob. Mercado ${badgeAPI}</span>
                            <span class="text-sm font-black ${colorScore}">${realProb}%</span>
                        </div>
                    </div>
                    <div class="text-[11px] font-bold text-slate-600 border-t pt-2 italic">
                        ${p.diagnostico}
                    </div>
                    <button onclick="eliminarPronostico(${p.id})" class="absolute top-2 right-2 text-slate-300 hover:text-rose-500 transition">✕</button>
                `;
                container.appendChild(card);
            });
        }

        async function eliminarPronostico(id) {
            if(!confirm("¿Borrar este pronóstico?")) return;
            const { error } = await _supabase.from('pronosticos').delete().eq('id', id);
            if(!error) location.reload();
        }

        loadPronosticos();
    </script>
</body>
</html>
