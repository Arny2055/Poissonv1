<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pronósticos Guardados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-2xl mx-auto">
        <header class="mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black text-slate-800 uppercase tracking-tighter">Pronósticos</h1>
                <p class="text-xs text-slate-500 font-bold uppercase">Historial del Súper Analizador</p>
            </div>
            <a href="goles.html" class="bg-white border border-slate-200 p-2 rounded-lg shadow-sm text-xs font-bold">⬅ Volver</a>
        </header>

        <button onclick="escanearValorAutomatico()"
        class="mb-4 w-full bg-emerald-600 text-white py-2 rounded-lg font-bold text-sm hover:bg-emerald-700 transition-colors">
        🔥 Escanear Valor Automático
        </button>

        <div id="loading" class="text-center py-10 text-slate-400 italic">Cargando pronósticos...</div>
        
        <div id="pronosticosList" class="space-y-4"></div>
    </div>

    <script>
        // CONFIGURACIÓN SUPABASE
        const SUPABASE_URL = 'https://idugbbdlyirhzgczpbhu.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkdWdiYmRseWlyaHpnY3pwYmh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NDQwNTQsImV4cCI6MjA5MTUyMDA1NH0.hK5A-F6TqzlSd6tc7adVptT6xbJN6lPscnJ1xHlzhFk'; 
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: true }
        });

        // CONFIGURACIÓN ODDS API PRO
        const ODDS_API_KEY = "9b56bb17..."; // Reemplaza con tu Key Real

        // ==========================
        // 🔥 FUNCIONES ODDS API PRO
        // ==========================

        async function oddsAPI_obtenerEventos() {
            try {
                const res = await fetch("https://api.odds-api.io/v3/events?sport=soccer&status=upcoming", {
                    headers: { "X-API-Key": ODDS_API_KEY }
                });
                const data = await res.json();
                return data.data || [];
            } catch (err) {
                console.error("Error eventos:", err);
                return [];
            }
        }

        async function oddsAPI_obtenerCuotas(eventId) {
            try {
                const res = await fetch(`https://api.odds-api.io/v3/event-odds?event_id=${eventId}`, {
                    headers: { "X-API-Key": ODDS_API_KEY }
                });
                return await res.json();
            } catch (err) {
                console.error("Error cuotas:", err);
                return null;
            }
        }

        async function oddsAPI_movimiento(eventId) {
            try {
                const res = await fetch(`https://api.odds-api.io/v3/odds-movement?event_id=${eventId}&market=over_under`, {
                    headers: { "X-API-Key": ODDS_API_KEY }
                });
                const data = await res.json();
                return data.data || [];
            } catch (err) {
                console.error("Error movimiento:", err);
                return [];
            }
        }

        function oddsAPI_extraerOver25(oddsData) {
            if (!oddsData || !oddsData.bookmakers) return null;
            for (const bookie of oddsData.bookmakers) {
                for (const market of bookie.markets || []) {
                    if (market.name === "over_under" || market.name === "totals") {
                        for (const outcome of market.outcomes) {
                            const point = parseFloat(outcome.point);
                            if ((outcome.name === "Over" || outcome.name === "over") && point === 2.5) {
                                return { cuota: outcome.price, casa: bookie.name };
                            }
                        }
                    }
                }
            }
            return null;
        }

        function oddsAPI_tendencia(movimientos) {
            if (movimientos.length < 2) return "ESTABLE";
            const last = movimientos[movimientos.length - 1].price;
            const prev = movimientos[movimientos.length - 2].price;
            if (last < prev) return "BAJANDO";
            if (last > prev) return "SUBIENDO";
            return "ESTABLE";
        }

        function limpiarTexto(texto) {
            if (!texto) return "";
            return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9 ]/g, "");
        }

        function oddsAPI_buscar(eventos, nombrePartido) {
            const partidoLimpio = limpiarTexto(nombrePartido);
            const palabras = partidoLimpio.split(" ").filter(p => p.length > 3 && p !== "vs");
            
            return eventos.find(e => {
                const home = limpiarTexto(e.home);
                const away = limpiarTexto(e.away);
                return palabras.some(p => home.includes(p) || away.includes(p));
            });
        }

        // ==========================
        // 🛠 LÓGICA DE LA APP
        // ==========================

        function calcularEV(probabilidad, cuota) {
            const prob = probabilidad / 100;
            return (prob * cuota) - 1;
        }

        async function loadPronosticos() {
            const { data: { session } } = await _supabase.auth.getSession();
            const user = session?.user;

            if (!user) {
                document.getElementById('loading').innerHTML = `<div class="text-rose-500 font-bold p-4 border border-rose-200 bg-rose-50 rounded-lg">⚠️ Inicia sesión.</div>`;
                return;
            }

            const { data, error } = await _supabase.from('pronosticos').select('*').eq('user_id', user.id).order('fecha', { ascending: false });
            document.getElementById('loading').classList.add('hidden');

            const container = document.getElementById('pronosticosList');
            if (error || !data || data.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400">No hay pronósticos.</div>`;
                return;
            }

            data.forEach(p => {
                const prob = parseFloat(p.score);
                const colorScore = prob >= 70 ? 'text-emerald-600' : (prob >= 55 ? 'text-amber-600' : 'text-rose-600');
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-xl border border-slate-200 shadow-sm relative overflow-hidden";
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${p.liga || 'LIGA'}</span>
                        <button onclick="eliminarPronostico('${p.id}')" class="text-rose-400 text-xs">✕</button>
                    </div>
                    <h3 class="text-lg font-black text-slate-800 mb-3">${p.partido}</h3>
                    <div class="flex items-center justify-between border-t pt-3">
                        <div>
                            <p class="text-[10px] uppercase font-bold text-slate-400">Prob. Over 2.5</p>
                            <p class="text-xl font-black ${colorScore}">${prob}%</p>
                        </div>
                        <div id="valor-${p.id}" class="text-right">
                            <span class="text-[10px] text-slate-400 italic">Esperando...</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function escanearValorAutomatico() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (!user) return;

            const { data: pronosticos } = await _supabase.from('pronosticos').select('*').eq('user_id', user.id);
            const eventosAPI = await oddsAPI_obtenerEventos();

            for (const p of pronosticos) {
                const contenedor = document.getElementById(`valor-${p.id}`);
                if (!contenedor) continue;

                contenedor.innerHTML = `<span class="text-[10px] text-emerald-500 animate-pulse font-bold">Escaneando...</span>`;
                
                const partidoAPI = oddsAPI_buscar(eventosAPI, p.partido);
                
                if (!partidoAPI) {
                    contenedor.innerHTML = "❌ No encontrado";
                    continue;
                }

                const oddsData = await oddsAPI_obtenerCuotas(partidoAPI.id);
                const extracto = oddsAPI_extraerOver25(oddsData);

                if (!extracto) {
                    contenedor.innerHTML = "❌ Sin Cuota O2.5";
                    continue;
                }

                const movimientos = await oddsAPI_movimiento(partidoAPI.id);
                const tendencia = oddsAPI_tendencia(movimientos);
                const ev = calcularEV(p.score, extracto.cuota);

                let colorTrend = tendencia === "BAJANDO" ? "text-emerald-500" : (tendencia === "SUBIENDO" ? "text-rose-500" : "text-slate-400");
                
                if (ev > 0) {
                    contenedor.innerHTML = `
                        <span class="text-emerald-600 font-bold">🔥 VALUE: ${extracto.cuota}</span><br>
                        <span class="text-[10px] text-slate-400">EV: ${(ev*100).toFixed(1)}% | </span>
                        <span class="text-[10px] ${colorTrend} font-black">${tendencia}</span>
                    `;
                } else {
                    contenedor.innerHTML = `
                        <span class="text-slate-500 font-bold">📊 Cuota: ${extracto.cuota}</span><br>
                        <span class="text-[10px] text-slate-400">No Value | </span>
                        <span class="text-[10px] ${colorTrend}">${tendencia}</span>
                    `;
                }
            }
        }

        async function eliminarPronostico(id) {
            if(!confirm("¿Eliminar?")) return;
            await _supabase.from('pronosticos').delete().eq('id', id);
            location.reload();
        }

        loadPronosticos();
    </script>
</body>
</html>
