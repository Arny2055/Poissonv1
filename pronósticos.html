<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Pronósticos Guardados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card-glow { transition: all 0.3s ease; }
        .card-glow:hover { transform: translateY(-2px); shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-2xl mx-auto">
        <header class="mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black text-slate-800 uppercase tracking-tighter">Pronósticos</h1>
                <p class="text-xs text-slate-500 font-bold uppercase italic">El Gurú de las Apuestas</p>
            </div>
            <a href="goles.html" class="bg-white border border-slate-200 py-2 px-4 rounded-lg shadow-sm text-xs font-black text-slate-700 hover:bg-slate-50 transition">⬅ VOLVER</a>
        </header>

        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-slate-300 border-t-indigo-600 mb-4"></div>
            <p class="text-slate-400 text-sm font-medium">Sincronizando con la nube...</p>
        </div>
        
        <div id="pronosticosList" class="space-y-4">
            </div>
    </div>

    <script>
        // --- CONFIGURACIÓN SUPABASE ---
        const SUPABASE_URL = 'https://idugbbdlyirhzgczpbhu.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkdWdiYmRseWlyaHpnY3pwYmh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NDQwNTQsImV4cCI6MjA5MTUyMDA1NH0.hK5A-F6TqzlSd6tc7adVptT6xbJN6lPscnJ1xHlzhFk';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadPronosticos() {
            try {
                // 1. Verificar sesión activa
                const { data: { session } } = await _supabase.auth.getSession();
                
                if (!session) {
                    document.getElementById('loading').innerHTML = `
                        <div class="bg-amber-50 border border-amber-200 p-4 rounded-lg">
                            <p class="text-amber-700 text-sm font-bold">⚠️ SESIÓN NO DETECTADA</p>
                            <p class="text-amber-600 text-xs mt-1">Debes estar logueado en la calculadora para ver tus picks.</p>
                        </div>
                    `;
                    return;
                }

                const user = session.user;

                // 2. Traer datos de la tabla 'pronosticos'
                const { data, error } = await _supabase
                    .from('pronosticos')
                    .select('*')
                    .eq('user_id', user.id)
                    .order('fecha', { ascending: false });

                // Ocultar cargando
                document.getElementById('loading').classList.add('hidden');

                const container = document.getElementById('pronosticosList');
                
                if (error) {
                    console.error("Error Supabase:", error);
                    container.innerHTML = `<p class="text-center text-red-500 text-xs font-bold">Error al conectar con la tabla: ${error.message}</p>`;
                    return;
                }

                if (!data || data.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-16 px-4 border-2 border-dashed border-slate-200 rounded-2xl">
                            <span class="text-4xl">📊</span>
                            <p class="mt-4 text-slate-500 font-bold text-sm">Aún no has enviado pronósticos.</p>
                            <p class="text-slate-400 text-[10px] mt-1">Usa el botón "Enviar a mis pronósticos" en la calculadora.</p>
                        </div>
                    `;
                    return;
                }

                // 3. Renderizar cada tarjeta
                container.innerHTML = ""; // Limpiar antes de llenar
                data.forEach(p => {
                    // Lógica de colores según el score de éxito
                    let colorScore = 'text-slate-700';
                    let borderClass = 'border-slate-200';
                    
                    const scoreNum = parseFloat(p.score);
                    if (scoreNum >= 70) {
                        colorScore = 'text-emerald-600';
                        borderClass = 'border-l-4 border-l-emerald-500';
                    } else if (scoreNum >= 55) {
                        colorScore = 'text-amber-600';
                        borderClass = 'border-l-4 border-l-amber-500';
                    } else {
                        colorScore = 'text-rose-600';
                        borderClass = 'border-l-4 border-l-rose-500';
                    }

                    const card = document.createElement('div');
                    card.className = `bg-white p-5 rounded-xl shadow-sm relative overflow-hidden card-glow border ${borderClass}`;
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[9px] font-black text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full uppercase tracking-wider">${p.liga}</span>
                            <span class="text-[10px] text-slate-400 font-medium">${new Date(p.fecha).toLocaleDateString()}</span>
                        </div>
                        
                        <h3 class="text-base font-black text-slate-800 leading-tight mb-4 pr-6">${p.partido}</h3>
                        
                        <div class="grid grid-cols-3 gap-2 mb-4">
                            <div class="text-center bg-slate-50 p-2 rounded-lg">
                                <span class="block text-[8px] font-bold text-slate-400 uppercase">Over 2.5</span>
                                <span class="text-sm font-black text-slate-700">${p.prob_o25}%</span>
                            </div>
                            <div class="text-center bg-slate-50 p-2 rounded-lg">
                                <span class="block text-[8px] font-bold text-slate-400 uppercase">Gol HT</span>
                                <span class="text-sm font-black text-slate-700">${p.prob_ht}%</span>
                            </div>
                            <div class="text-center bg-indigo-50 p-2 rounded-lg">
                                <span class="block text-[8px] font-bold text-indigo-400 uppercase">Éxito</span>
                                <span class="text-sm font-black ${colorScore}">${p.score}%</span>
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-2 text-[11px] font-bold text-slate-600 border-t border-slate-50 pt-3">
                            <span class="text-base">📝</span>
                            <span class="italic leading-snug">${p.diagnostico}</span>
                        </div>
                        
                        <button onclick="eliminarPronostico(${p.id})" 
                                class="absolute top-3 right-3 text-slate-300 hover:text-rose-500 transition-colors p-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error("Error crítico:", err);
                document.getElementById('loading').textContent = "Error de conexión.";
            }
        }

        async function eliminarPronostico(id) {
            if(!confirm("¿Deseas eliminar este análisis de tu historial?")) return;
            
            const { error } = await _supabase
                .from('pronosticos')
                .delete()
                .eq('id', id);
            
            if(!error) {
                // Recarga suave: eliminamos el elemento del DOM o refrescamos
                location.reload();
            } else {
                alert("No se pudo eliminar: " + error.message);
            }
        }

        // Ejecutar al cargar la página
        loadPronosticos();
    </script>
</body>
</html>
