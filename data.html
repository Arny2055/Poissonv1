<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Manager - Tablas de Fútbol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .table-container { overflow-x: auto; }
        .card { background: white; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-700 text-slate-800 tracking-tight">Data Manager - Tablas de Fútbol</h1>
            <p class="text-slate-500">Gestión de estadísticas para modelos de Poisson</p>

            <div class="mt-6 flex flex-wrap justify-center gap-2">
                <a href="data.html" class="bg-blue-50 text-blue-700 border border-blue-200 py-2 px-4 rounded-md text-sm font-bold shadow-sm">
                    📁 Gestión de Datos
                </a>
                <a href="index.html" class="bg-white text-slate-700 border border-slate-200 py-2 px-4 rounded-md hover:bg-slate-50 transition text-sm font-medium shadow-sm">
                    🎯 1X2 FT/HT
                </a>
                <a href="goles.html" class="bg-white text-slate-700 border border-slate-200 py-2 px-4 rounded-md hover:bg-slate-50 transition text-sm font-medium shadow-sm">
                    ⚽ Goles O/U
                </a>
                <a href="btts.html" class="bg-white text-slate-700 border border-slate-200 py-2 px-4 rounded-md hover:bg-slate-50 transition text-sm font-medium shadow-sm">
                    🔄 BTTS
                </a>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1 space-y-6">
                <div class="card p-6">
                    <h2 class="text-xl font-semibold mb-4 text-slate-700">Importar Datos</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Liga</label>
                            <input type="text" id="leagueName" placeholder="Ej: Premier League" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700">Tipo de Tabla</label>
                            <select id="tableType" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2">
                                <option value="Home">Home</option>
                                <option value="Away">Away</option>
                                <option value="First Half Home">First Half Home</option>
                                <option value="First Half Away">First Half Away</option>
                                <option value="Second Half Home">Second Half Home</option>
                                <option value="Second Half Away">Second Half Away</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700">Datos (Pegar texto)</label>
                            <textarea id="rawTableData" rows="8" placeholder="Inter Milan 16 12 2 2 44 15 38" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 font-mono text-xs"></textarea>
                        </div>

                        <button onclick="saveCurrentTable()" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition font-medium">
                            Guardar Tabla
                        </button>
                    </div>
                </div>

                <div class="card p-6">
                    <h2 class="text-xl font-semibold mb-4 text-slate-700">Herramientas JSON</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="exportData()" class="bg-slate-100 text-slate-700 py-2 px-4 rounded-md hover:bg-slate-200 transition text-sm font-medium">Exportar</button>
                        <button onclick="document.getElementById('importFile').click()" class="bg-slate-100 text-slate-700 py-2 px-4 rounded-md hover:bg-slate-200 transition text-sm font-medium">Importar</button>
                        <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
                    </div>
                    <button onclick="clearAllData()" class="w-full mt-4 border border-red-200 text-red-600 py-2 px-4 rounded-md hover:bg-red-50 transition text-sm font-medium">
                        Eliminar Todo
                    </button>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div id="dataDisplay" class="space-y-6">
                    </div>
            </div>

        </div>
    </div>

    <script>
        /* ==========================================
           CORE LOGIC & STORAGE
           ========================================== */
        
        let footballData = JSON.parse(localStorage.getItem("footballData")) || [];

        function saveCurrentTable() {
            const league = document.getElementById('leagueName').value.trim();
            const type = document.getElementById('tableType').value;
            const rawData = document.getElementById('rawTableData').value.trim();

            if (!league || !rawData) {
                alert("Por favor completa el nombre de la liga y los datos.");
                return;
            }

            const parsedRows = parseRawData(rawData);
            
            if (parsedRows.length === 0) {
                alert("No se detectaron datos válidos. Verifica el formato.");
                return;
            }

            const newEntry = {
                liga: league,
                tipo: type,
                fecha: new Date().toISOString().split('T')[0],
                tabla: parsedRows
            };

            footballData = footballData.filter(item => !(item.liga === league && item.tipo === type));
            footballData.push(newEntry);

            localStorage.setItem("footballData", JSON.stringify(footballData));
            alert("Tabla guardada correctamente");
            renderData();
            document.getElementById('rawTableData').value = '';
        }

        function parseRawData(text) {
            const lines = text.split('\n');
            const result = [];
            lines.forEach(line => {
                const regex = /^(.*?)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+(-?\+?\d+)$/;
                const match = line.trim().match(regex);
                if (match) {
                    const equipo = match[1];
                    const gf = parseInt(match[6]);
                    const ga = parseInt(match[7]);
                    result.push({
                        equipo: equipo,
                        GP: parseInt(match[2]),
                        W: parseInt(match[3]),
                        D: parseInt(match[4]),
                        L: parseInt(match[5]),
                        GF: gf,
                        GA: ga,
                        GD: gf - ga,
                        Pts: parseInt(match[8])
                    });
                }
            });
            return result;
        }

        function renderData() {
            const container = document.getElementById('dataDisplay');
            container.innerHTML = '';
            if (footballData.length === 0) {
                container.innerHTML = '<div class="card p-8 text-center text-gray-400">No hay datos almacenados.</div>';
                return;
            }
            footballData.forEach((entry, index) => {
                const section = document.createElement('div');
                section.className = 'card p-6';
                let rowsHtml = entry.tabla.map(row => `
                    <tr class="border-b border-gray-100 hover:bg-gray-50">
                        <td class="py-2 font-medium text-gray-800">${row.equipo}</td>
                        <td class="text-center py-2">${row.GP}</td>
                        <td class="text-center py-2">${row.W}</td>
                        <td class="text-center py-2">${row.D}</td>
                        <td class="text-center py-2">${row.L}</td>
                        <td class="text-center py-2 font-semibold text-blue-600">${row.GF}</td>
                        <td class="text-center py-2 font-semibold text-red-600">${row.GA}</td>
                        <td class="text-center py-2 text-gray-500">${row.GD > 0 ? '+' + row.GD : row.GD}</td>
                        <td class="text-center py-2 font-bold">${row.Pts}</td>
                    </tr>
                `).join('');
                section.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-lg font-bold text-slate-800">${entry.liga} - ${entry.tipo}</h3>
                            <span class="text-xs text-slate-400 font-mono">Actualizado: ${entry.fecha}</span>
                        </div>
                        <button onclick="deleteEntry(${index})" class="text-red-400 hover:text-red-600 text-sm">Eliminar</button>
                    </div>
                    <div class="table-container">
                        <table class="w-full text-sm text-left">
                            <thead>
                                <tr class="text-gray-400 border-b">
                                    <th class="pb-2 font-medium uppercase">Equipo</th>
                                    <th class="pb-2 text-center font-medium">GP</th>
                                    <th class="pb-2 text-center font-medium">W</th>
                                    <th class="pb-2 text-center font-medium">D</th>
                                    <th class="pb-2 text-center font-medium">L</th>
                                    <th class="pb-2 text-center font-medium">GF</th>
                                    <th class="pb-2 text-center font-medium">GA</th>
                                    <th class="pb-2 text-center font-medium">GD</th>
                                    <th class="pb-2 text-center font-medium">Pts</th>
                                </tr>
                            </thead>
                            <tbody>${rowsHtml}</tbody>
                        </table>
                    </div>
                `;
                container.appendChild(section);
            });
        }

        function deleteEntry(index) {
            if (confirm("¿Eliminar esta tabla?")) {
                footballData.splice(index, 1);
                localStorage.setItem("footballData", JSON.stringify(footballData));
                renderData();
            }
        }

        function clearAllData() {
            if (confirm("¿Estás seguro de que quieres borrar TODA la base de datos?")) {
                footballData = [];
                localStorage.removeItem("footballData");
                renderData();
            }
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(footballData, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `stats_export_${new Date().getTime()}.json`;
            a.click();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        footballData = imported;
                        localStorage.setItem("footballData", JSON.stringify(footballData));
                        renderData();
                        alert("Datos importados correctamente");
                    }
                } catch (err) { alert("Error: El archivo JSON no es válido."); }
            };
            reader.readAsText(file);
        }

        renderData();
    </script>
</body>
</html>
