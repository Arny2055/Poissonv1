<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Manager - Tablas de Fútbol</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .table-container { overflow-x: auto; }
        .card { background: white; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 0.75rem; }
        .bg-win { background-color: #dcfce7; } 
        .bg-draw { background-color: #fef9c3; } 
        .bg-loss { background-color: #fee2e2; }
        .loading-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-700 text-slate-800 tracking-tight">Data Manager - Tablas de Fútbol</h1>
            <p class="text-slate-500">Gestión de estadísticas para modelos de Poisson</p>

            <div class="mt-6 flex flex-wrap justify-center gap-2">
                <a href="data.html" class="bg-blue-50 text-blue-700 border border-blue-200 py-2 px-4 rounded-md text-sm font-bold shadow-sm">
                    📁 Gestión de Datos
                </a>
                <a href="index.html" class="bg-white text-slate-700 border border-slate-200 py-2 px-4 rounded-md hover:bg-slate-50 transition text-sm font-medium shadow-sm">
                    🎯 1X2 FT/HT
                </a>
                <a href="goles.html" class="bg-white text-slate-700 border border-slate-200 py-2 px-4 rounded-md hover:bg-slate-50 transition text-sm font-medium shadow-sm">
                    ⚽ Goles O/U
                </a>
                <a href="btts.html" class="bg-white text-slate-700 border border-slate-200 py-2 px-4 rounded-md hover:bg-slate-50 transition text-sm font-medium shadow-sm">
                    🔄 BTTS
                </a>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1 space-y-6">
                <div class="card p-6 border-t-4 border-green-500">
                    <h2 class="text-xl font-semibold mb-2 text-slate-700 flex items-center gap-2">
                        <span>📊 Google Sheets Cloud</span>
                    </h2>
                    <p class="text-xs text-gray-500 mb-4">Respalda tus ligas en la nube para no perderlas al borrar caché.</p>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="syncToCloud('save')" class="bg-green-600 text-white py-2 px-3 rounded-md hover:bg-green-700 transition text-xs font-bold shadow-sm">
                            Subir a Sheets
                        </button>
                        <button onclick="syncToCloud('sync')" class="bg-white text-green-700 border border-green-600 py-2 px-3 rounded-md hover:bg-green-50 transition text-xs font-bold">
                            Bajar de Sheets
                        </button>
                    </div>
                    <div id="syncStatus" class="mt-2 text-[10px] text-center font-medium hidden"></div>
                </div>

                <div class="card p-6">
                    <h2 class="text-xl font-semibold mb-4 text-slate-700">Importar Multi-Tablas</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Nombre de la Liga</label>
                            <input type="text" id="leagueName" placeholder="Ej: Serie A" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-blue-600 uppercase">1. Home FT</label>
                            <textarea id="dataHomeFT" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md p-2"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-blue-600 uppercase">2. Away FT</label>
                            <textarea id="dataAwayFT" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md p-2"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-orange-600 uppercase">3. Home 1T (HT)</label>
                            <textarea id="dataHomeHT" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md p-2"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-orange-600 uppercase">4. Away 1T (HT)</label>
                            <textarea id="dataAwayHT" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md p-2"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-green-600 uppercase">5. Goals Home (Time)</label>
                            <textarea id="dataTimeHome" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md p-2"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-green-600 uppercase">6. Goals Away (Time)</label>
                            <textarea id="dataTimeAway" rows="3" class="mt-1 block w-full border border-gray-300 rounded-md p-2"></textarea>
                        </div>
                        <button onclick="saveAllTables()" class="w-full bg-blue-600 text-white py-3 px-4 rounded-md hover:bg-blue-700 transition font-bold shadow-lg">
                            Guardar Todas las Tablas
                        </button>
                    </div>
                </div>

                <div class="card p-6">
                    <h2 class="text-xl font-semibold mb-4 text-slate-700">Herramientas JSON</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="exportData()" class="bg-slate-100 text-slate-700 py-2 px-4 rounded-md hover:bg-slate-200 transition text-sm font-medium">Exportar</button>
                        <button onclick="document.getElementById('importFile').click()" class="bg-slate-100 text-slate-700 py-2 px-4 rounded-md hover:bg-slate-200 transition text-sm font-medium">Importar</button>
                        <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
                    </div>
                    <button onclick="clearAllData()" class="w-full mt-4 border border-red-200 text-red-600 py-2 px-4 rounded-md hover:bg-red-50 transition text-sm font-medium">
                        Eliminar Todo
                    </button>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="card p-6 border-l-4 border-blue-500">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Seleccionar Liga:</label>
                    <select id="leagueFilter" onchange="renderData()" class="block w-full border border-gray-300 rounded-md shadow-sm p-3 bg-white text-lg font-semibold text-slate-800">
                        <option value="">-- Selecciona una liga guardada --</option>
                    </select>
                </div>
                <div id="dataDisplay" class="space-y-6"></div>
            </div>

        </div>
    </div>

    <script>
        // PEGA AQUÍ TU URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz6STTssFRA0Ybe9Altd_P0JUE4EnhOijgXZG-ajgoImjVMNPexqqmoo9_O47mAAQjMnQ/exec";

        let footballData = JSON.parse(localStorage.getItem("footballData")) || [];

        // FUNCIÓN DE SINCRONIZACIÓN CORREGIDA
         async function syncToCloud(action) {
    const status = document.getElementById('syncStatus');
    status.className = "mt-2 text-[10px] text-center font-medium block text-blue-600 loading-pulse";
    status.innerText = "Conectando...";

    try {
        if (action === 'save') {
            // Verificamos si hay datos para enviar
            if (footballData.length === 0) {
                alert("No hay datos para subir. Agrega una liga primero.");
                status.classList.add('hidden');
                return;
            }

            // Enviamos los datos
            await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Necesario para evitar bloqueos de Google
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'save', payload: footballData })
            });
            
            status.innerText = "✓ Enviado (Verifica Celda A1)";
        } else {
            // BAJAR DATOS
            const response = await fetch(SCRIPT_URL);
            const rawResponse = await response.text();
            
            if (rawResponse && rawResponse !== "[]") {
                footballData = JSON.parse(rawResponse);
                localStorage.setItem("footballData", JSON.stringify(footballData));
                updateLeagueFilter();
                renderData();
                status.innerText = "✓ Datos bajados de la nube";
            } else {
                status.innerText = "La celda A1 está vacía";
            }
        }
        status.className = "mt-2 text-[10px] text-center font-medium block text-green-600";
    } catch (e) {
        status.className = "mt-2 text-[10px] text-center font-medium block text-red-600";
        status.innerText = "Error de conexión";
        console.error(e);
    }
    setTimeout(() => status.classList.add('hidden'), 4000);
}

        // LÓGICA DE NEGOCIO (No se modifica)
        function saveAllTables() {
            const league = document.getElementById('leagueName').value.trim();
            if (!league) return alert("Ingresa nombre de liga");
            const inputs = [
                { id: 'dataHomeFT', type: 'Home' }, { id: 'dataAwayFT', type: 'Away' },
                { id: 'dataHomeHT', type: 'First Half Home' }, { id: 'dataAwayHT', type: 'First Half Away' },
                { id: 'dataTimeHome', type: 'Time Segment Home' }, { id: 'dataTimeAway', type: 'Time Segment Away' }
            ];
            let count = 0;
            inputs.forEach(input => {
                const raw = document.getElementById(input.id).value.trim();
                if (raw) {
                    const isTime = input.id.includes('Time');
                    const rows = isTime ? parseTimeSegmentData(raw) : parseRawData(raw);
                    if (rows.length > 0) {
                        footballData = footballData.filter(item => !(item.liga === league && item.tipo === input.type));
                        footballData.push({ liga: league, tipo: input.type, fecha: new Date().toISOString().split('T')[0], tabla: rows, isTimeSegment: isTime });
                        count++;
                        document.getElementById(input.id).value = '';
                    }
                }
            });
            if (count > 0) {
                localStorage.setItem("footballData", JSON.stringify(footballData));
                updateLeagueFilter();
                renderData();
            }
        }

        function parseRawData(text) {
            return text.split('\n').map(line => {
                const clean = line.trim();
                const regex = /^(?:\d+\s+)?(.*?)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+([\+\-]?\d+)\s+(\d+)(?:\s+[\d\.]+)?$/;
                const match = clean.match(regex);
                if (match) {
                    const gf = parseInt(match[6]), ga = parseInt(match[7]);
                    return { equipo: match[1].trim(), GP: parseInt(match[2]), W: parseInt(match[3]), D: parseInt(match[4]), L: parseInt(match[5]), GF: gf, GA: ga, GD: gf - ga, Pts: parseInt(match[9]) };
                }
            }).filter(Boolean);
        }

        function parseTimeSegmentData(text) {
            return text.split('\n').map(line => {
                const regex = /^(.*?)\s+(\d+-\d+)\s+(\d+-\d+)\s+(\d+-\d+)\s+(\d+-\d+)\s+(\d+-\d+)\s+(\d+-\d+)$/;
                const match = line.trim().match(regex);
                if (match) {
                    let segments = [], maxDiff = -1, boldIdx = -1;
                    for(let i=2; i<=7; i++) {
                        const [s, c] = match[i].split('-').map(Number);
                        const diff = Math.abs(s - c);
                        if (diff > maxDiff) { maxDiff = diff; boldIdx = i-2; }
                        segments.push({ s, c, raw: match[i] });
                    }
                    return { equipo: match[1].trim(), segments, boldIdx };
                }
            }).filter(Boolean);
        }

        function updateLeagueFilter() {
            const filter = document.getElementById('leagueFilter');
            const current = filter.value;
            const leagues = [...new Set(footballData.map(item => item.liga))].sort();
            filter.innerHTML = '<option value="">-- Selecciona una liga guardada --</option>';
            leagues.forEach(l => {
                const opt = document.createElement('option');
                opt.value = opt.textContent = l;
                filter.appendChild(opt);
            });
            filter.value = current;
        }

        function renderData() {
            const container = document.getElementById('dataDisplay');
            const selected = document.getElementById('leagueFilter').value;
            container.innerHTML = '';
            if (!selected) return;
            footballData.filter(i => i.liga === selected).forEach(entry => {
                const div = document.createElement('div');
                div.className = 'card p-6 mb-4';
                let tableHtml = '';
                if (entry.isTimeSegment) {
                    let rows = entry.tabla.map(row => {
                        let tds = row.segments.map((seg, idx) => {
                            let color = seg.s > seg.c ? 'bg-win' : (seg.s === seg.c ? 'bg-draw' : 'bg-loss');
                            let bold = idx === row.boldIdx ? 'font-black underline' : '';
                            return `<td class="text-center py-2 ${color} ${bold} border border-white">${seg.raw}</td>`;
                        }).join('');
                        return `<tr class="border-b"><td class="py-2 font-medium">${row.equipo}</td>${tds}</tr>`;
                    }).join('');
                    tableHtml = `<table class="w-full text-xs"><thead><tr class="text-gray-500"><th>Equipo</th><th>0-15</th><th>16-30</th><th>31-45*</th><th>46-60</th><th>61-75</th><th>76-90*</th></tr></thead><tbody>${rows}</tbody></table>`;
                } else {
                    let rows = entry.tabla.map(r => `<tr class="border-b"><td class="py-2">${r.equipo}</td><td class="text-center">${r.GP}</td><td class="text-center">${r.W}</td><td class="text-center">${r.D}</td><td class="text-center">${r.L}</td><td class="text-center text-blue-600 font-bold">${r.GF}</td><td class="text-center text-red-600 font-bold">${r.GA}</td><td class="text-center">${r.GD}</td><td class="text-center font-bold">${r.Pts}</td></tr>`).join('');
                    tableHtml = `<table class="w-full text-sm"><thead><tr class="text-gray-400"><th>Equipo</th><th>GP</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>${rows}</tbody></table>`;
                }
                div.innerHTML = `<div class="flex justify-between mb-4"><div><h3 class="font-bold">${entry.liga} - ${entry.tipo}</h3><span class="text-[10px] text-gray-400">Act: ${entry.fecha}</span></div><button onclick="deleteEntry('${entry.liga}','${entry.tipo}')" class="text-red-400 text-xs">Eliminar</button></div>${tableHtml}`;
                container.appendChild(div);
            });
        }

        function deleteEntry(liga, tipo) {
            if (confirm("¿Eliminar?")) {
                footballData = footballData.filter(i => !(i.liga === liga && i.tipo === tipo));
                localStorage.setItem("footballData", JSON.stringify(footballData));
                updateLeagueFilter(); renderData();
            }
        }

        function clearAllData() { if (confirm("¿Borrar todo?")) { footballData = []; localStorage.removeItem("footballData"); updateLeagueFilter(); renderData(); } }
        function exportData() {
            const blob = new Blob([JSON.stringify(footballData, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a"); a.href = url; a.download = `backup.json`; a.click();
        }
        function importData(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (ev) => { footballData = JSON.parse(ev.target.result); localStorage.setItem("footballData", JSON.stringify(footballData)); updateLeagueFilter(); renderData(); };
            reader.readAsText(file);
        }

        updateLeagueFilter();
        renderData();
    </script>
</body>
</html>
