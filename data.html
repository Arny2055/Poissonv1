<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Manager - Tablas de Fútbol (Cloud)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .table-container { overflow-x: auto; }
        .card { background: white; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 0.75rem; }
        .bg-win { background-color: #dcfce7; } /* Scored > Conceded */
        .bg-draw { background-color: #fef9c3; } /* Scored = Conceded */
        .bg-loss { background-color: #fee2e2; } /* Scored < Conceded */
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-700 text-slate-800 tracking-tight">Data Manager - Tablas de Fútbol</h1>
            <p class="text-slate-500">Gestión de estadísticas para modelos de Poisson en la Nube</p>

            <div class="mt-6 flex flex-wrap justify-center gap-2">
                <a href="data.html" class="bg-blue-50 text-blue-700 border border-blue-200 py-2 px-4 rounded-md text-sm font-bold shadow-sm">
                    📁 Gestión de Datos
                </a>
                <a href="index.html" class="bg-white text-slate-700 border border-slate-200 py-2 px-4 rounded-md hover:bg-slate-50 transition text-sm font-medium shadow-sm">
                    🎯 1X2 FT/HT
                </a>
                <a href="goles.html" class="bg-white text-slate-700 border border-slate-200 py-2 px-4 rounded-md hover:bg-slate-50 transition text-sm font-medium shadow-sm">
                    ⚽ Goles O/U
                </a>
                <a href="btts.html" class="bg-white text-slate-700 border border-slate-200 py-2 px-4 rounded-md hover:bg-slate-50 transition text-sm font-medium shadow-sm">
                    🔄 BTTS
                </a>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-1 space-y-6">
                <div class="card p-6">
                    <h2 class="text-xl font-semibold mb-4 text-slate-700">Importar Multi-Tablas</h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Nombre de la Liga</label>
                            <input type="text" id="leagueName" placeholder="Ej: Serie A" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-blue-600 uppercase">1. Home FT</label>
                            <textarea id="dataHomeFT" rows="3" placeholder="Pegar tabla Home FT aquí..." class="mt-1 block w-full border border-gray-300 rounded-md p-2"></textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-blue-600 uppercase">2. Away FT</label>
                            <textarea id="dataAwayFT" rows="3" placeholder="Pegar tabla Away FT aquí..." class="mt-1 block w-full border border-gray-300 rounded-md p-2"></textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-orange-600 uppercase">3. Home 1T (HT)</label>
                            <textarea id="dataHomeHT" rows="3" placeholder="Pegar tabla Home 1T aquí..." class="mt-1 block w-full border border-gray-300 rounded-md p-2"></textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-orange-600 uppercase">4. Away 1T (HT)</label>
                            <textarea id="dataAwayHT" rows="3" placeholder="Pegar tabla Away 1T aquí..." class="mt-1 block w-full border border-gray-300 rounded-md p-2"></textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-green-600 uppercase">5. Goals Home (Time Segment)</label>
                            <textarea id="dataTimeHome" rows="3" placeholder="Pegar tabla Goals per time segment (home)..." class="mt-1 block w-full border border-gray-300 rounded-md p-2"></textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-green-600 uppercase">6. Goals Away (Time Segment)</label>
                            <textarea id="dataTimeAway" rows="3" placeholder="Pegar tabla Goals per time segment (away)..." class="mt-1 block w-full border border-gray-300 rounded-md p-2"></textarea>
                        </div>

                        <button onclick="saveAllTables()" class="w-full bg-blue-600 text-white py-3 px-4 rounded-md hover:bg-blue-700 transition font-bold shadow-lg">
                            Guardar Todas las Tablas en Supabase
                        </button>
                    </div>
                </div>

                <div class="card p-6">
                    <h2 class="text-xl font-semibold mb-4 text-slate-700">Herramientas JSON</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="exportData()" class="bg-slate-100 text-slate-700 py-2 px-4 rounded-md hover:bg-slate-200 transition text-sm font-medium">Exportar</button>
                        <button onclick="document.getElementById('importFile').click()" class="bg-slate-100 text-slate-700 py-2 px-4 rounded-md hover:bg-slate-200 transition text-sm font-medium">Importar</button>
                        <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
                    </div>
                    <button onclick="clearAllData()" class="w-full mt-4 border border-red-200 text-red-600 py-2 px-4 rounded-md hover:bg-red-50 transition text-sm font-medium">
                        Eliminar Todo
                    </button>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="card p-6 border-l-4 border-blue-500">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Seleccionar Liga para visualizar:</label>
                    <div class="flex gap-2">
                        <select id="leagueFilter" onchange="renderData()" class="block w-full border border-gray-300 rounded-md shadow-sm p-3 bg-white text-lg font-semibold text-slate-800 focus:ring-blue-500 focus:border-blue-500">
                            <option value="">Cargando ligas...</option>
                        </select>
                        <button onclick="loadFromSupabase()" class="p-3 bg-slate-100 rounded-md hover:bg-slate-200">🔄</button>
                    </div>
                </div>

                <div id="dataDisplay" class="space-y-6">
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN DE SUPABASE ---
        const SUPABASE_URL = 'https://idugbbdlyirhzgczpbhu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkdWdiYmRseWlyaHpnY3pwYmh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5NDQwNTQsImV4cCI6MjA5MTUyMDA1NH0.hK5A-F6TqzlSd6tc7adVptT6xbJN6lPscnJ1xHlzhFk';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let footballData = [];

        // --- FUNCIÓN PARA CARGAR DESDE LA NUBE ---
        async function loadFromSupabase() {
            const { data, error } = await _supabase
                .from('football_data')
                .select('*');

            if (error) {
                console.error("Error cargando Supabase:", error);
                alert("Error al conectar con la nube.");
            } else {
                // Convertimos el formato de la DB al formato de tu app
                footballData = data.map(item => ({
                    liga: item.liga,
                    tipo: item.tipo,
                    fecha: item.fecha,
                    tabla: item.tabla_json,
                    isTimeSegment: item.is_time
                }));
                updateLeagueFilter();
                renderData();
            }
        }

        // --- FUNCIÓN PARA GUARDAR (MEJORADA) ---
        async function saveAllTables() {
            const league = document.getElementById('leagueName').value.trim();
            if (!league) {
                alert("Por favor, ingresa el nombre de la liga.");
                return;
            }

            const inputs = [
                { id: 'dataHomeFT', type: 'Home' },
                { id: 'dataAwayFT', type: 'Away' },
                { id: 'dataHomeHT', type: 'First Half Home' },
                { id: 'dataAwayHT', type: 'First Half Away' },
                { id: 'dataTimeHome', type: 'Time Segment Home' },
                { id: 'dataTimeAway', type: 'Time Segment Away' }
            ];

            let count = 0;

            for (const input of inputs) {
                const rawData = document.getElementById(input.id).value.trim();
                if (rawData) {
                    const isTime = input.id.includes('Time');
                    const parsedRows = isTime ? parseTimeSegmentData(rawData) : parseRawData(rawData);
                    
                    if (parsedRows.length > 0) {
                        const { error } = await _supabase
                            .from('football_data')
                            .upsert({
                                liga: league,
                                tipo: input.type,
                                tabla_json: parsedRows,
                                is_time: isTime,
                                fecha: new Date().toISOString().split('T')[0]
                            }, { onConflict: 'liga, tipo' });

                        if (error) {
                            console.error("Error en upsert:", error);
                        } else {
                            count++;
                            document.getElementById(input.id).value = '';
                        }
                    }
                }
            }

            if (count > 0) {
                alert(`Sincronizado con éxito: ${count} tablas en la nube.`);
                await loadFromSupabase();
            } else {
                alert("No se detectaron datos válidos.");
            }
        }

        // --- TU LÓGICA MATEMÁTICA (INTACTA) ---
        function parseRawData(text) {
            const lines = text.split('\n');
            const result = [];
            lines.forEach(line => {
                const cleanLine = line.trim();
                if (!cleanLine || cleanLine.includes('GP') || cleanLine.includes('table')) return;

                const regex = /^(?:\d+\s+)?(.*?)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+(\d+)\s+([\+\-]?\d+)\s+(\d+)(?:\s+[\d\.]+)?$/;
                const match = cleanLine.match(regex);
                if (match) {
                    const gf = parseInt(match[6]);
                    const ga = parseInt(match[7]);
                    result.push({
                        equipo: match[1].trim(),
                        GP: parseInt(match[2]),
                        W: parseInt(match[3]),
                        D: parseInt(match[4]),
                        L: parseInt(match[5]),
                        GF: gf,
                        GA: ga,
                        GD: gf - ga,
                        Pts: parseInt(match[9])
                    });
                }
            });
            return result;
        }

        function parseTimeSegmentData(text) {
            const lines = text.split('\n');
            const result = [];
            lines.forEach(line => {
                const cleanLine = line.trim();
                if (!cleanLine || cleanLine.includes('0-15') || cleanLine.includes('Goals')) return;

                const regex = /^(.*?)\s+(\d+-\d+)\s+(\d+-\d+)\s+(\d+-\d+)\s+(\d+-\d+)\s+(\d+-\d+)\s+(\d+-\d+)$/;
                const match = cleanLine.match(regex);
                
                if (match) {
                    const segments = [];
                    let maxDiff = -1;
                    let boldIdx = -1;

                    for(let i=2; i<=7; i++) {
                        const [s, c] = match[i].split('-').map(Number);
                        const diff = Math.abs(s - c);
                        if (diff > maxDiff) {
                            maxDiff = diff;
                            boldIdx = i-2;
                        }
                        segments.push({ s, c, raw: match[i] });
                    }

                    result.push({
                        equipo: match[1].trim(),
                        segments: segments,
                        boldIdx: boldIdx
                    });
                }
            });
            return result;
        }

        function updateLeagueFilter() {
            const filter = document.getElementById('leagueFilter');
            const currentSelection = filter.value;
            const leagues = [...new Set(footballData.map(item => item.liga))].sort();
            filter.innerHTML = '<option value="">-- Selecciona una liga guardada --</option>';
            leagues.forEach(league => {
                const option = document.createElement('option');
                option.value = league;
                option.textContent = league;
                filter.appendChild(option);
            });
            filter.value = currentSelection;
        }

        function renderData() {
            const container = document.getElementById('dataDisplay');
            const selectedLeague = document.getElementById('leagueFilter').value;
            container.innerHTML = '';

            if (footballData.length === 0) {
                container.innerHTML = '<div class="card p-8 text-center text-gray-400">No hay datos en la nube.</div>';
                return;
            }

            if (!selectedLeague) {
                container.innerHTML = '<div class="card p-8 text-center text-blue-400 font-medium">Selecciona una liga para visualizar datos.</div>';
                return;
            }
            
            const filteredData = footballData.filter(item => item.liga === selectedLeague);

            filteredData.forEach((entry) => {
                const section = document.createElement('div');
                section.className = 'card p-6 mb-4';
                
                let contentHtml = '';

                if (entry.isTimeSegment) {
                    let rowsTime = entry.tabla.map(row => {
                        let tds = row.segments.map((seg, idx) => {
                            let colorClass = seg.s > seg.c ? 'bg-win' : (seg.s === seg.c ? 'bg-draw' : 'bg-loss');
                            let weight = idx === row.boldIdx ? 'font-black underline' : '';
                            return `<td class="text-center py-2 ${colorClass} ${weight} border border-white">${seg.raw}</td>`;
                        }).join('');
                        return `<tr class="border-b border-gray-100"><td class="py-2 font-medium">${row.equipo}</td>${tds}</tr>`;
                    }).join('');

                    contentHtml = `
                        <div class="table-container">
                            <table class="w-full text-xs text-left border-collapse">
                                <thead>
                                    <tr class="text-gray-500 border-b">
                                        <th class="pb-2">Equipo</th>
                                        <th class="pb-2 text-center">0-15</th>
                                        <th class="pb-2 text-center">16-30</th>
                                        <th class="pb-2 text-center">31-45*</th>
                                        <th class="pb-2 text-center">46-60</th>
                                        <th class="pb-2 text-center">61-75</th>
                                        <th class="pb-2 text-center">76-90*</th>
                                    </tr>
                                </thead>
                                <tbody>${rowsTime}</tbody>
                            </table>
                        </div>`;
                } else {
                    let rowsHtml = entry.tabla.map(row => `
                        <tr class="border-b border-gray-100 hover:bg-gray-50">
                            <td class="py-2 font-medium text-gray-800">${row.equipo}</td>
                            <td class="text-center py-2">${row.GP}</td>
                            <td class="text-center py-2">${row.W}</td>
                            <td class="text-center py-2">${row.D}</td>
                            <td class="text-center py-2">${row.L}</td>
                            <td class="text-center py-2 font-semibold text-blue-600">${row.GF}</td>
                            <td class="text-center py-2 font-semibold text-red-600">${row.GA}</td>
                            <td class="text-center py-2 text-gray-500">${row.GD > 0 ? '+' + row.GD : row.GD}</td>
                            <td class="text-center py-2 font-bold">${row.Pts}</td>
                        </tr>
                    `).join('');

                    contentHtml = `
                        <div class="table-container">
                            <table class="w-full text-sm text-left">
                                <thead>
                                    <tr class="text-gray-400 border-b">
                                        <th class="pb-2 font-medium uppercase">Equipo</th>
                                        <th class="pb-2 text-center font-medium">GP</th>
                                        <th class="pb-2 text-center font-medium">W</th>
                                        <th class="pb-2 text-center font-medium">D</th>
                                        <th class="pb-2 text-center font-medium">L</th>
                                        <th class="pb-2 text-center font-medium">GF</th>
                                        <th class="pb-2 text-center font-medium">GA</th>
                                        <th class="pb-2 text-center font-medium">GD</th>
                                        <th class="pb-2 text-center font-medium">Pts</th>
                                    </tr>
                                </thead>
                                <tbody>${rowsHtml}</tbody>
                            </table>
                        </div>`;
                }

                section.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h3 class="text-lg font-bold text-slate-800">${entry.liga} - <span class="text-blue-600">${entry.tipo}</span></h3>
                            <span class="text-xs text-slate-400 font-mono">Actualizado: ${entry.fecha} ${entry.isTimeSegment ? ' (Segments)' : ''}</span>
                        </div>
                        <button onclick="deleteFromSupabase('${entry.liga}', '${entry.tipo}')" class="text-red-400 hover:text-red-600 text-sm">Eliminar</button>
                    </div>
                    ${contentHtml}
                `;
                container.appendChild(section);
            });
        }

        async function deleteFromSupabase(liga, tipo) {
            if (confirm(`¿Eliminar la tabla ${tipo} de ${liga} de la nube?`)) {
                const { error } = await _supabase
                    .from('football_data')
                    .delete()
                    .match({ liga: liga, tipo: tipo });

                if (error) {
                    alert("Error al borrar.");
                } else {
                    await loadFromSupabase();
                }
            }
        }

        async function clearAllData() {
            if (confirm("¿Borrar TODA la base de datos en la nube?")) {
                const { error } = await _supabase
                    .from('football_data')
                    .delete()
                    .neq('liga', 'un_valor_imposible'); // Borra todo

                if (!error) await loadFromSupabase();
            }
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(footballData, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `betags_cloud_export_${new Date().getTime()}.json`;
            a.click();
        }

        async function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        for (const item of imported) {
                            await _supabase.from('football_data').upsert({
                                liga: item.liga,
                                tipo: item.tipo,
                                tabla_json: item.tabla,
                                is_time: item.isTimeSegment,
                                fecha: item.fecha
                            });
                        }
                        await loadFromSupabase();
                        alert("Datos importados a la nube");
                    }
                } catch (err) { alert("Error: JSON no válido."); }
            };
            reader.readAsText(file);
        }

        // Carga inicial al abrir la página
        loadFromSupabase();
    </script>
</body>
</html>
