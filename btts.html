<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora BTTS - Poisson</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .card { background: white; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .btts-yes { color: #059669; }
        .btts-no { color: #dc2626; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-slate-800 tracking-tight">BTTS</h1>
            <p class="text-slate-500 uppercase text-xs tracking-widest mt-2">Ambos Equipos Anotan (Both Teams To Score)</p>
            
            <div class="mt-6 flex flex-wrap justify-center gap-2">
                <a href="data.html" class="bg-white text-slate-700 border border-slate-200 py-2 px-4 rounded-md hover:bg-slate-50 transition text-sm font-medium shadow-sm">
                    📁 Gestión de Datos
                </a>
                <a href="index.html" class="bg-white text-slate-700 border border-slate-200 py-2 px-4 rounded-md hover:bg-slate-50 transition text-sm font-medium shadow-sm">
                    🎯 1X2 FT/HT
                </a>
                <a href="goles.html" class="bg-white text-slate-700 border border-slate-200 py-2 px-4 rounded-md hover:bg-slate-50 transition text-sm font-medium shadow-sm">
                    ⚽ Goles O/U
                </a>
                <a href="btts.html" class="bg-indigo-50 text-indigo-700 border border-indigo-200 py-2 px-4 rounded-md text-sm font-bold shadow-sm">
                    🔄 BTTS
                </a>
            </div>
        </header>

        <div class="card p-6 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Liga</label>
                    <select id="selectLeague" onchange="updateTeams()" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 bg-white">
                        <option value="">Seleccionar Liga</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Local</label>
                    <select id="homeTeam" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 bg-white">
                        <option value="">--</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Visitante</label>
                    <select id="awayTeam" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 bg-white">
                        <option value="">--</option>
                    </select>
                </div>
            </div>

            <button onclick="mainCalculation()" class="w-full mt-6 bg-indigo-600 text-white py-3 px-4 rounded-md hover:bg-indigo-700 transition font-bold text-lg">
                CALCULAR BTTS
            </button>
        </div>

        <div id="resultsWrapper" class="hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <div class="card p-6 border-b-4 border-emerald-500">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 text-center">Full Time (FT)</h3>
                    <div id="ftXg" class="text-center text-xs text-slate-400 mb-4"></div>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center p-4 bg-emerald-50 rounded-lg">
                            <span class="font-bold text-emerald-800">BTTS SÍ</span>
                            <span id="ftYes" class="text-2xl font-black btts-yes">0%</span>
                        </div>
                        <div class="flex justify-between items-center p-4 bg-red-50 rounded-lg">
                            <span class="font-bold text-red-800">BTTS NO</span>
                            <span id="ftNo" class="text-2xl font-black btts-no">0%</span>
                        </div>
                    </div>
                </div>

                <div class="card p-6 border-b-4 border-amber-500">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 text-center">Half Time (HT)</h3>
                    <div id="htXg" class="text-center text-xs text-slate-400 mb-4"></div>
                    <div class="space-y-4">
                        <div class="flex justify-between items-center p-4 bg-emerald-50 rounded-lg">
                            <span class="font-bold text-emerald-800">BTTS SÍ</span>
                            <span id="htYes" class="text-2xl font-black btts-yes">0%</span>
                        </div>
                        <div class="flex justify-between items-center p-4 bg-red-50 rounded-lg">
                            <span class="font-bold text-red-800">BTTS NO</span>
                            <span id="htNo" class="text-2xl font-black btts-no">0%</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <div id="emptyState" class="text-center py-12 text-gray-400">
            Selecciona los equipos para procesar las probabilidades de anotación.
        </div>
    </div>

    <script>
        /* ==========================================
           CORE DATA
           ========================================== */
        const getData = () => JSON.parse(localStorage.getItem("footballData")) || [];

        function init() {
            const data = getData();
            const leagueSelect = document.getElementById('selectLeague');
            const ligas = [...new Set(data.map(item => item.liga))];
            ligas.forEach(l => {
                const opt = document.createElement('option');
                opt.value = opt.textContent = l;
                leagueSelect.appendChild(opt);
            });
        }

        function updateTeams() {
            const liga = document.getElementById('selectLeague').value;
            const hSel = document.getElementById('homeTeam');
            const aSel = document.getElementById('awayTeam');
            hSel.innerHTML = aSel.innerHTML = '<option value="">--</option>';
            if (!liga) return;

            const tHome = getData().find(t => t.liga === liga && t.tipo === 'Home');
            const tAway = getData().find(t => t.liga === liga && t.tipo === 'Away');

            if(tHome) tHome.tabla.forEach(t => hSel.innerHTML += `<option value="${t.equipo}">${t.equipo}</option>`);
            if(tAway) tAway.tabla.forEach(t => aSel.innerHTML += `<option value="${t.equipo}">${t.equipo}</option>`);
        }

        /* ==========================================
           LÓGICA POISSON
           ========================================== */
        function poisson(k, lambda) {
            return (Math.exp(-lambda) * Math.pow(lambda, k)) / factorial(k);
        }

        function factorial(n) { return n <= 1 ? 1 : n * factorial(n - 1); }

        function getLambdas(liga, homeName, awayName, isHT) {
            const hType = isHT ? "First Half Home" : "Home";
            const aType = isHT ? "First Half Away" : "Away";
            const dataH = getData().find(t => t.liga === liga && t.tipo === hType);
            const dataA = getData().find(t => t.liga === liga && t.tipo === aType);

            if (!dataH || !dataA) return null;

            const lAvgH = dataH.tabla.reduce((s, t) => s + t.GF, 0) / dataH.tabla.reduce((s, t) => s + t.GP, 0);
            const lAvgA = dataA.tabla.reduce((s, t) => s + t.GF, 0) / dataA.tabla.reduce((s, t) => s + t.GP, 0);

            const eH = dataH.tabla.find(t => t.equipo === homeName);
            const eA = dataA.tabla.find(t => t.equipo === awayName);
            if (!eH || !eA) return null;

            const attH = (eH.GF / eH.GP) / lAvgH;
            const defH = (eH.GA / eH.GP) / lAvgA;
            const attA = (eA.GF / eA.GP) / lAvgA;
            const defA = (eA.GA / eA.GP) / lAvgH;

            return {
                h: attH * defA * lAvgH,
                a: attA * defH * lAvgA
            };
        }

        /* ==========================================
           CÁLCULO BTTS
           ========================================== */
        function mainCalculation() {
            const liga = document.getElementById('selectLeague').value;
            const home = document.getElementById('homeTeam').value;
            const away = document.getElementById('awayTeam').value;

            if (!liga || !home || !away) return alert("Selecciona liga y equipos.");

            const ftL = getLambdas(liga, home, away, false);
            const htL = getLambdas(liga, home, away, true);

            if (!ftL) return alert("Faltan datos de tablas para esta liga.");

            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('resultsWrapper').classList.remove('hidden');

            renderBTTS('ft', ftL);
            renderBTTS('ht', htL);
        }

        function renderBTTS(prefix, lambdas) {
            const yesEl = document.getElementById(`${prefix}Yes`);
            const noEl = document.getElementById(`${prefix}No`);
            const xgEl = document.getElementById(`${prefix}Xg`);

            if (!lambdas) {
                yesEl.innerText = "--";
                noEl.innerText = "--";
                xgEl.innerText = "Datos HT no disponibles";
                return;
            }

            // P(0) para cada equipo
            const pHome0 = poisson(0, lambdas.h);
            const pAway0 = poisson(0, lambdas.a);

            // Probabilidad de que ambos marquen:
            // (1 - P(Home=0)) * (1 - P(Away=0))
            const probBothScore = (1 - pHome0) * (1 - pAway0);
            const bttsYes = probBothScore * 100;
            const bttsNo = 100 - bttsYes;

            yesEl.innerText = `${bttsYes.toFixed(2)}%`;
            noEl.innerText = `${bttsNo.toFixed(2)}%`;
            xgEl.innerText = `xG H: ${lambdas.h.toFixed(2)} | xG A: ${lambdas.a.toFixed(2)}`;
        }

        init();
    </script>
</body>
</html>
