<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Over/Under - Poisson</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .card { background: white; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .grid-header { background-color: #f8fafc; font-weight: 600; color: #64748b; font-size: 0.75rem; text-transform: uppercase; }
        canvas { max-height: 300px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="mb-8 text-center">
            <h1 class="text-4xl font-bold text-slate-800 tracking-tight">Over / Under</h1>
            <p class="text-slate-500 uppercase text-xs tracking-widest mt-2">Distribución de Goles Totales</p>
            
            <div class="mt-6 flex flex-wrap justify-center gap-2">
                <a href="data.html" class="bg-white text-slate-700 border border-slate-200 py-2 px-4 rounded-md hover:bg-slate-50 transition text-sm font-medium shadow-sm">📁 Gestión de Datos</a>
                <a href="index.html" class="bg-white text-slate-700 border border-slate-200 py-2 px-4 rounded-md hover:bg-slate-50 transition text-sm font-medium shadow-sm">🎯 1X2 FT/HT</a>
                <a href="goles.html" class="bg-green-50 text-green-700 border border-green-200 py-2 px-4 rounded-md text-sm font-bold shadow-sm">⚽ Goles O/U</a>
                <a href="btts.html" class="bg-white text-slate-700 border border-slate-200 py-2 px-4 rounded-md hover:bg-slate-50 transition text-sm font-medium shadow-sm">🔄 BTTS</a>
            </div>
        </header>

        <div class="card p-6 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Liga</label>
                    <select id="selectLeague" onchange="updateTeams(); saveMatchSelection();" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 bg-white">
                        <option value="">Seleccionar Liga</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Local</label>
                    <select id="homeTeam" onchange="saveMatchSelection()" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 bg-white">
                        <option value="">--</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Visitante</label>
                    <select id="awayTeam" onchange="saveMatchSelection()" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 bg-white">
                        <option value="">--</option>
                    </select>
                </div>
            </div>
            <button onclick="mainCalculation()" class="w-full mt-6 bg-green-600 text-white py-3 px-4 rounded-md hover:bg-green-700 transition font-bold text-lg">ANALIZAR GOLES</button>
        </div>

        <div id="resultsWrapper" class="hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div class="card p-4">
                    <h4 class="text-sm font-bold text-slate-600 mb-2 uppercase text-center">Distribución Prob. Over 0.5 HT (Local)</h4>
                    <canvas id="chartHomeTime"></canvas>
                </div>
                <div class="card p-4">
                    <h4 class="text-sm font-bold text-slate-600 mb-2 uppercase text-center">Distribución Prob. Over 0.5 HT (Visita)</h4>
                    <canvas id="chartAwayTime"></canvas>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="card p-6 border-t-4 border-green-500">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Full Time (90 min)</h3>
                    <div id="ftXgDisplay" class="mb-4 text-sm font-medium text-slate-600"></div>
                    <div class="overflow-hidden rounded-lg border border-gray-200">
                        <div class="grid grid-cols-3 grid-header p-2 text-center"><div>Mercado</div><div>Over</div><div>Under</div></div>
                        <div id="ftOuTable" class="divide-y divide-gray-100"></div>
                    </div>
                </div>
                <div class="card p-6 border-t-4 border-indigo-500">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Half Time (45 min)</h3>
                    <div id="htXgDisplay" class="mb-4 text-sm font-medium text-slate-600"></div>
                    <div class="overflow-hidden rounded-lg border border-gray-200">
                        <div class="grid grid-cols-3 grid-header p-2 text-center"><div>Mercado</div><div>Over</div><div>Under</div></div>
                        <div id="htOuTable" class="divide-y divide-gray-100"></div>
                    </div>
                </div>
            </div>
        </div>
        <div id="emptyState" class="text-center py-12 text-gray-400">Selecciona liga y equipos para calcular.</div>
    </div>

    <script>
        const getData = () => JSON.parse(localStorage.getItem("footballData")) || [];
        let charts = {};

        function getSegmentPercentages(liga, teamName, type, over05HTProb = 0) {
            const dataEntry = getData().find(t => t.liga === liga && t.tipo === type);
            if (!dataEntry || !dataEntry.tabla) return null;

            const team = dataEntry.tabla.find(t => t.equipo === teamName);
            if (!team) return null;

            const totalScored = team.segments.reduce((acc, curr) => acc + curr.s, 0);
            const totalConceded = team.segments.reduce((acc, curr) => acc + curr.c, 0);

            const teamScored = team.segments.map(s => totalScored > 0 ? (s.s / totalScored * 100).toFixed(1) : 0);
            const teamConceded = team.segments.map(s => totalConceded > 0 ? (s.c / totalConceded * 100).toFixed(1) : 0);

            let leagueTotals = [0, 0, 0, 0, 0, 0];
            let leagueGrandTotal = 0;
            dataEntry.tabla.forEach(t => {
                t.segments.forEach((s, idx) => {
                    leagueTotals[idx] += s.s;
                    leagueGrandTotal += s.s;
                });
            });
            const leagueAvg = leagueTotals.map(v => leagueGrandTotal > 0 ? (v / leagueGrandTotal * 100).toFixed(1) : 0);

            const probDistribution = team.segments.map((s, idx) => {
                if (idx > 2) return 0;
                const weight0_45 = (parseFloat(teamScored[0]) + parseFloat(teamConceded[0]) + parseFloat(leagueAvg[0])) +
                                   (parseFloat(teamScored[1]) + parseFloat(teamConceded[1]) + parseFloat(leagueAvg[1])) +
                                   (parseFloat(teamScored[2]) + parseFloat(teamConceded[2]) + parseFloat(leagueAvg[2]));
                const currentWeight = (parseFloat(teamScored[idx]) + parseFloat(teamConceded[idx]) + parseFloat(leagueAvg[idx]));
                return weight0_45 > 0 ? (over05HTProb * (currentWeight / weight0_45)).toFixed(1) : 0;
            });

            return { teamScored, teamConceded, leagueAvg, probDistribution };
        }

        function renderChart(canvasId, label, dataObj) {
            if (charts[canvasId]) charts[canvasId].destroy();
            const ctx = document.getElementById(canvasId).getContext('2d');
            
            charts[canvasId] = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['0-15', '16-30', '31-45', '46-60', '61-75', '76-90'],
                    datasets: [
                        {
                            label: 'Anotados (%)',
                            data: dataObj.teamScored,
                            backgroundColor: 'rgba(34, 197, 94, 0.3)',
                            borderColor: 'rgb(34, 197, 94)',
                            borderWidth: 1,
                            hidden: true
                        },
                        {
                            label: 'Concedidos (%)',
                            data: dataObj.teamConceded,
                            backgroundColor: 'rgba(239, 68, 68, 0.3)',
                            borderColor: 'rgb(239, 68, 68)',
                            borderWidth: 1,
                            hidden: true
                        },
                        {
                            label: 'Prob. Over 0.5 HT (%)',
                            data: dataObj.probDistribution,
                            backgroundColor: 'rgba(59, 130, 246, 0.8)', 
                            borderColor: 'rgb(59, 130, 246)',
                            borderWidth: 2,
                            hidden: false
                        },
                        {
                            label: 'Prom. Liga (%)',
                            data: dataObj.leagueAvg,
                            borderColor: 'rgb(148, 163, 184)',
                            borderWidth: 2,
                            type: 'line',
                            pointRadius: 0,
                            fill: false,
                            tension: 0.4,
                            hidden: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: { 
                        y: { beginAtZero: true, max: 100, ticks: { callback: v => v + '%' } } 
                    },
                    plugins: { 
                        legend: { 
                            position: 'bottom', 
                            labels: { boxWidth: 10, font: { size: 9 } },
                            onClick: function(e, legendItem, legend) {
                                const index = legendItem.datasetIndex;
                                const ci = legend.chart;
                                if (ci.isDatasetVisible(index)) {
                                    ci.hide(index);
                                    legendItem.hidden = true;
                                } else {
                                    ci.show(index);
                                    legendItem.hidden = false;
                                }
                            }
                        }
                    }
                }
            });
        }

        function saveMatchSelection() {
            const selection = {
                liga: document.getElementById('selectLeague').value,
                home: document.getElementById('homeTeam').value,
                away: document.getElementById('awayTeam').value
            };
            sessionStorage.setItem("selectedMatch", JSON.stringify(selection));
        }

        function loadMatchSelection() {
            const saved = JSON.parse(sessionStorage.getItem("selectedMatch"));
            if (saved && saved.liga) {
                document.getElementById('selectLeague').value = saved.liga;
                updateTeams();
                document.getElementById('homeTeam').value = saved.home;
                document.getElementById('awayTeam').value = saved.away;
                if(saved.home && saved.away) mainCalculation();
            }
        }

        function init() {
            const data = getData();
            const leagueSelect = document.getElementById('selectLeague');
            const ligas = [...new Set(data.map(item => item.liga))];
            ligas.forEach(l => {
                const opt = document.createElement('option');
                opt.value = opt.textContent = l;
                leagueSelect.appendChild(opt);
            });
            loadMatchSelection();
        }

        function updateTeams() {
            const liga = document.getElementById('selectLeague').value;
            const hSel = document.getElementById('homeTeam');
            const aSel = document.getElementById('awayTeam');
            hSel.innerHTML = aSel.innerHTML = '<option value="">--</option>';
            if (!liga) return;
            const tHome = getData().find(t => t.liga === liga && t.tipo === 'Home');
            const tAway = getData().find(t => t.liga === liga && t.tipo === 'Away');
            if(tHome) tHome.tabla.forEach(t => hSel.innerHTML += `<option value="${t.equipo}">${t.equipo}</option>`);
            if(tAway) tAway.tabla.forEach(t => aSel.innerHTML += `<option value="${t.equipo}">${t.equipo}</option>`);
        }

        function factorial(n) { return n <= 1 ? 1 : n * factorial(n - 1); }
        function poisson(k, lambda) { return (Math.exp(-lambda) * Math.pow(lambda, k)) / factorial(k); }

        function getLambdas(liga, homeName, awayName, isHT) {
            const hType = isHT ? "First Half Home" : "Home";
            const aType = isHT ? "First Half Away" : "Away";
            const dataH = getData().find(t => t.liga === liga && t.tipo === hType);
            const dataA = getData().find(t => t.liga === liga && t.tipo === aType);
            if (!dataH || !dataA) return null;
            const lAvgH = dataH.tabla.reduce((s, t) => s + t.GF, 0) / dataH.tabla.reduce((s, t) => s + t.GP, 0);
            const lAvgA = dataA.tabla.reduce((s, t) => s + t.GF, 0) / dataA.tabla.reduce((s, t) => s + t.GP, 0);
            const eH = dataH.tabla.find(t => t.equipo === homeName);
            const eA = dataA.tabla.find(t => t.equipo === awayName);
            if (!eH || !eA) return null;
            return { h: (eH.GF/eH.GP)/(lAvgH) * (eA.GA/eA.GP)/(lAvgH) * lAvgH, a: (eA.GF/eA.GP)/(lAvgA) * (eH.GA/eH.GP)/(lAvgA) * lAvgA };
        }

        function calculateOverProb(lambdas, line) {
            const probTotalGoles = new Array(11).fill(0); 
            for (let i = 0; i <= 7; i++) {
                for (let j = 0; j <= 7; j++) {
                    const p = poisson(i, lambdas.h) * poisson(j, lambdas.a);
                    if (i + j <= 10) probTotalGoles[i + j] += p;
                }
            }
            let probUnder = 0;
            for (let g = 0; g < line; g++) probUnder += probTotalGoles[g];
            return (1 - probUnder) * 100;
        }

        function mainCalculation() {
            const liga = document.getElementById('selectLeague').value;
            const home = document.getElementById('homeTeam').value;
            const away = document.getElementById('awayTeam').value;
            if (!liga || !home || !away) return;

            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('resultsWrapper').classList.remove('hidden');

            const htLambdas = getLambdas(liga, home, away, true);
            const probOver05HT = htLambdas ? calculateOverProb(htLambdas, 0.5) : 0;

            const homeSegments = getSegmentPercentages(liga, home, 'Time Segment Home', probOver05HT);
            const awaySegments = getSegmentPercentages(liga, away, 'Time Segment Away', probOver05HT);
            
            if(homeSegments) renderChart('chartHomeTime', 'Local', homeSegments);
            if(awaySegments) renderChart('chartAwayTime', 'Visitante', awaySegments);

            const ftL = getLambdas(liga, home, away, false);
            const htL = getLambdas(liga, home, away, true);
            if (ftL) renderOU('ft', ftL, [0.5, 1.5, 2.5, 3.5, 4.5]);
            if (htL) renderOU('ht', htL, [0.5, 1.5, 2.5]);
        }

        function renderOU(prefix, lambdas, lines) {
            const container = document.getElementById(`${prefix}OuTable`);
            const xgEl = document.getElementById(`${prefix}XgDisplay`);
            container.innerHTML = "";
            if (!lambdas) { container.innerHTML = '<div class="p-4 text-xs text-red-500">Datos no disponibles</div>'; return; }
            xgEl.innerHTML = `xG esperado: ${(lambdas.h + lambdas.a).toFixed(2)} goles`;
            
            const probTotalGoles = new Array(11).fill(0); 
            for (let i = 0; i <= 7; i++) {
                for (let j = 0; j <= 7; j++) {
                    const p = poisson(i, lambdas.h) * poisson(j, lambdas.a);
                    if (i + j <= 10) probTotalGoles[i + j] += p;
                }
            }
            lines.forEach(line => {
                let probUnder = 0;
                for (let g = 0; g < line; g++) probUnder += probTotalGoles[g];
                const probOver = 1 - probUnder;
                const probOverPercent = (probOver * 100).toFixed(1);
                
                const row = document.createElement('div');
                
                // MEJORA: Resaltado bg-emerald-100 si Over 0.5 HT >= 70%
                let highlightClass = "";
                if (prefix === 'ht' && line === 0.5 && parseFloat(probOverPercent) >= 70) {
                    highlightClass = "bg-emerald-100 border-y border-emerald-200 shadow-sm transition-all";
                }

                row.className = `grid grid-cols-3 p-3 text-center text-sm items-center ${highlightClass}`;
                row.innerHTML = `
                    <div class="font-bold text-slate-700">${line}</div>
                    <div class="text-green-600 font-bold">${probOverPercent}%</div>
                    <div class="text-red-600 font-semibold">${(probUnder * 100).toFixed(1)}%</div>
                `;
                container.appendChild(row);
            });
        }
        init();
    </script>
</body>
</html>
