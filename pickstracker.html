<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>APUESTA SYSTEM PRO – QUANT EDITION</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #0a0e14;
            --bg-card: #151a21;
            --accent-blue: #007aff;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --text-main: #e0e0e0;
            --text-dim: #8892b0;
            --border: #232d3b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            line-height: 1.4;
            padding-bottom: 50px;
        }

        /* --- UI COMPONENTS --- */
        .header {
            padding: 20px;
            background: linear-gradient(145deg, #1a202c, #0a0e14);
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .header h1 { font-size: 1.2rem; letter-spacing: 2px; color: var(--accent-blue); }

        /* Estilos de Navegación */
        .nav-container {
            display: flex;
            gap: 10px;
            padding: 10px 15px;
            justify-content: center;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }

        .nav-btn {
            flex: 1;
            padding: 10px;
            font-size: 0.8rem;
            text-decoration: none;
            text-align: center;
            background: #1d232d;
            color: var(--text-main);
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: 0.3s;
        }

        .nav-btn:active {
            background: var(--accent-blue);
            transform: scale(0.95);
        }

        .container { padding: 15px; max-width: 1200px; margin: auto; }

        .grid-dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--bg-card);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-card span { display: block; font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; }
        .stat-card b { font-size: 1.1rem; color: #fff; }
        .stat-card.highlight { border-left: 4px solid var(--accent-blue); }

        /* --- FORM --- */
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-bottom: 5px; }
        input, select {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid var(--border);
            color: white;
            border-radius: 8px;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary { background: var(--accent-blue); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--accent-blue); color: var(--accent-blue); margin-top: 10px; }

        /* --- TABLE & LISTS --- */
        .table-container { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { text-align: left; padding: 12px; color: var(--text-dim); border-bottom: 1px solid var(--border); }
        td { padding: 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }

        .tag {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        .tag-win { background: rgba(46, 204, 113, 0.2); color: var(--accent-green); }
        .tag-loss { background: rgba(231, 76, 60, 0.2); color: var(--accent-red); }
        .tag-void { background: rgba(136, 146, 176, 0.2); color: var(--text-dim); }

        /* Selector de resultado en tabla */
        .select-result-table {
            width: auto;
            padding: 4px;
            font-size: 0.75rem;
            background: #1a202c;
            border: 1px solid var(--border);
            color: white;
            border-radius: 4px;
        }

        /* --- INSIGHTS --- */
        .insight-box {
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .insight-alert { background: rgba(231, 76, 60, 0.1); border: 1px solid var(--accent-red); color: #ffbcbc; }
        .insight-fire { background: rgba(46, 204, 113, 0.1); border: 1px solid var(--accent-green); color: #b7ffcf; }

        /* --- CHARTS --- */
        .chart-box { height: 250px; margin-top: 20px; }

        /* Responsive Mobile Fixes */
        @media (max-width: 600px) {
            .grid-dashboard { grid-template-columns: repeat(2, 1fr); }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>APUESTA SYSTEM <span style="color: #fff;">PRO</span></h1>
    <p style="font-size: 0.7rem; color: var(--text-dim);">QUANTITATIVE ENGINE v2.0</p>
</div>

<div class="nav-container">
    <a href="index.html" class="nav-btn"><i class="fa fa-home"></i> Inicio</a>
    <a href="goles.html" class="nav-btn"><i class="fa fa-futbol"></i> Goles</a>
    <a href="btts.html" class="nav-btn"><i class="fa fa-exchange-alt"></i> BTTS</a>
</div>

<div class="container">
    
    <div class="grid-dashboard">
        <div class="stat-card highlight">
            <span>Bank Actual</span>
            <b id="stat-bank">$0.00</b>
        </div>
        <div class="stat-card">
            <span>Profit Neto</span>
            <b id="stat-profit">$0.00</b>
        </div>
        <div class="stat-card">
            <span>Yield %</span>
            <b id="stat-yield">0.00%</b>
        </div>
        <div class="stat-card">
            <span>Winrate</span>
            <b id="stat-winrate">0%</b>
        </div>
        <div class="stat-card">
            <span>Edge Promedio</span>
            <b id="stat-edge">0.00%</b>
        </div>
        <div class="stat-card">
            <span>EV Acumulado</span>
            <b id="stat-ev">$0.00</b>
        </div>
    </div>

    <div id="insights-container"></div>

    <div class="card">
        <div class="form-row" style="align-items: flex-end;">
            <div class="input-group">
                <label>Bank Inicial ($)</label>
                <input type="number" id="config-bank" value="1000" onchange="updateSystem()">
            </div>
            <div class="input-group">
                <label>Modo de Stake</label>
                <select id="config-stake-mode" onchange="updateSystem()">
                    <option value="percent">Porcentaje (%)</option>
                    <option value="fixed">Fijo ($)</option>
                </select>
            </div>
        </div>
    </div>

    <div class="card">
        <h3 style="margin-bottom: 15px; font-size: 0.9rem; color: var(--accent-blue);">NUEVA OPERACIÓN</h3>
        
        <div class="form-row">
            <div class="input-group">
                <label>Partido / Evento</label>
                <input type="text" id="inp-match" placeholder="Ej: Real Madrid vs Barca">
            </div>
            <div class="input-group">
                <label>Liga</label>
                <input type="text" id="inp-league" placeholder="La Liga">
            </div>
        </div>

        <div class="form-row">
            <div class="input-group">
                <label>Mercado</label>
                <select id="inp-market">
                    <option value="1X2">1X2</option>
                    <option value="O/U">Over/Under</option>
                    <option value="BTTS">BTTS</option>
                    <option value="Handicap">Handicap</option>
                    <option value="Otros">Otros</option>
                </select>
            </div>
            <div class="input-group">
                <label>Cuota Inicial</label>
                <input type="number" id="inp-odds" step="0.01" placeholder="1.90">
            </div>
        </div>

        <div class="form-row">
            <div class="input-group">
                <label>Prob. Estimada (%)</label>
                <input type="number" id="inp-prob" placeholder="55">
            </div>
            <div class="input-group">
                <label>Stake (Valor)</label>
                <input type="number" id="inp-stake-val" placeholder="1">
            </div>
        </div>

        <div class="form-row">
            <div class="input-group">
                <label>Cuota Cierre (CLV)</label>
                <input type="number" id="inp-closing-odds" step="0.01" placeholder="1.85">
            </div>
            <div class="input-group">
                <label>Resultado</label>
                <select id="inp-result">
                    <option value="Pending">Pendiente</option>
                    <option value="Win">Ganada</option>
                    <option value="Loss">Perdida</option>
                    <option value="Void">Nula</option>
                </select>
            </div>
        </div>

        <button class="btn-primary" onclick="addBet()">REGISTRAR APUESTA</button>
    </div>

    <div class="card">
        <h3 style="font-size: 0.9rem;">EVOLUCIÓN DE BANK</h3>
        <div class="chart-box">
            <canvas id="mainChart"></canvas>
        </div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="font-size: 0.9rem;">HISTORIAL QUANT</h3>
            <button onclick="exportCSV()" style="width: auto; padding: 5px 10px; font-size: 0.7rem;" class="btn-outline">Exportar CSV</button>
        </div>
        <div class="table-container">
            <table id="betTable">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Partido</th>
                        <th>Cuota</th>
                        <th>Edge</th>
                        <th>EV %</th>
                        <th>Res</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="betBody"></tbody>
            </table>
        </div>
    </div>

    <button class="btn-outline" onclick="backupData()">DESCARGAR BACKUP JSON</button>
    <button class="btn-outline" style="border-color: #e74c3c; color: #e74c3c;" onclick="clearAll()">BORRAR TODO</button>

</div>

<script>
    // --- STATE MANAGEMENT ---
    let bets = JSON.parse(localStorage.getItem('quant_bets')) || [];
    let myChart = null;

    // --- CORE CALCULATIONS ENGINE ---
    function calculateQuantMetrics(bet, currentBank) {
        const impliedProb = 1 / bet.odds;
        const probEstimada = bet.prob / 100;
        
        const edge = probEstimada - impliedProb;
        const evPercent = (probEstimada * (bet.odds - 1)) - (1 - probEstimada);
        
        // Stake Calculation
        let investment = 0;
        const stakeMode = document.getElementById('config-stake-mode').value;
        if(stakeMode === 'percent') {
            investment = (bet.stakeVal / 100) * currentBank;
        } else {
            investment = bet.stakeVal;
        }

        const evCash = investment * evPercent;
        const clv = bet.closingOdds ? (bet.odds - bet.closingOdds) : 0;

        let profit = 0;
        let units = 0;
        if(bet.result === 'Win') {
            profit = investment * (bet.odds - 1);
            units = (bet.odds - 1);
        } else if(bet.result === 'Loss') {
            profit = -investment;
            units = -1;
        } else if(bet.result === 'Void') {
            profit = 0;
            units = 0;
        }

        return { ...bet, impliedProb, edge, evPercent, evCash, investment, profit, units, clv };
    }

    // --- UI ACTIONS ---
    function addBet() {
        const newBet = {
            id: Date.now(),
            date: new Date().toLocaleDateString(),
            match: document.getElementById('inp-match').value || 'Evento Genérico',
            league: document.getElementById('inp-league').value || 'Sin Liga',
            market: document.getElementById('inp-market').value,
            odds: parseFloat(document.getElementById('inp-odds').value),
            prob: parseFloat(document.getElementById('inp-prob').value),
            stakeVal: parseFloat(document.getElementById('inp-stake-val').value),
            closingOdds: parseFloat(document.getElementById('inp-closing-odds').value) || 0,
            result: document.getElementById('inp-result').value
        };

        if(!newBet.odds || !newBet.stakeVal) return alert("Completa los campos técnicos.");

        bets.push(newBet);
        saveAndRefresh();
        resetForm();
    }

    // NUEVA FUNCIÓN: Cambiar resultado directamente en el historial
    function updateBetResult(id, newResult) {
        const index = bets.findIndex(b => b.id === id);
        if (index !== -1) {
            bets[index].result = newResult;
            saveAndRefresh();
        }
    }

    function deleteBet(id) {
        bets = bets.filter(b => b.id !== id);
        saveAndRefresh();
    }

    function saveAndRefresh() {
        localStorage.setItem('quant_bets', JSON.stringify(bets));
        updateSystem();
    }

    function resetForm() {
        document.getElementById('inp-match').value = '';
        document.getElementById('inp-odds').value = '';
        document.getElementById('inp-prob').value = '';
        document.getElementById('inp-stake-val').value = '';
    }

    // --- REFRESH SYSTEM ---
    function updateSystem() {
        const initialBank = parseFloat(document.getElementById('config-bank').value) || 0;
        let runningBank = initialBank;
        let totalProfit = 0;
        let totalInversion = 0;
        let wins = 0;
        let totalSettled = 0;
        let totalEdge = 0;
        let totalEV = 0;
        let chartData = [initialBank];
        let chartLabels = ['Inicio'];

        const processedBets = [];
        const body = document.getElementById('betBody');
        body.innerHTML = '';

        bets.forEach((rawBet, index) => {
            const b = calculateQuantMetrics(rawBet, runningBank);
            processedBets.push(b);

            if(b.result !== 'Pending') {
                runningBank += b.profit;
                totalProfit += b.profit;
                totalInversion += b.investment;
                totalSettled++;
                if(b.result === 'Win') wins++;
                totalEdge += b.edge;
                totalEV += b.evCash;
            }

            chartData.push(runningBank);
            chartLabels.push(`B${index + 1}`);

            // Add to table with interactive select
            const row = `
                <tr>
                    <td>${b.date}</td>
                    <td>${b.match}<br><small>${b.league}</small></td>
                    <td>${b.odds.toFixed(2)}</td>
                    <td style="color: ${b.edge > 0 ? 'var(--accent-green)' : 'var(--accent-red)'}">
                        ${(b.edge * 100).toFixed(1)}%
                    </td>
                    <td>${(b.evPercent * 100).toFixed(1)}%</td>
                    <td>
                        <select onchange="updateBetResult(${b.id}, this.value)" class="select-result-table">
                            <option value="Pending" ${b.result === 'Pending' ? 'selected' : ''}>⏳</option>
                            <option value="Win" ${b.result === 'Win' ? 'selected' : ''}>✅ Ganada</option>
                            <option value="Loss" ${b.result === 'Loss' ? 'selected' : ''}>❌ Perdida</option>
                            <option value="Void" ${b.result === 'Void' ? 'selected' : ''}>⚪ Nula</option>
                        </select>
                    </td>
                    <td><i class="fa fa-trash" onclick="deleteBet(${b.id})" style="color: var(--accent-red); cursor:pointer;"></i></td>
                </tr>
            `;
            body.innerHTML += row;
        });

        // Update Dashboard
        document.getElementById('stat-bank').innerText = `$${runningBank.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        document.getElementById('stat-profit').innerText = `$${totalProfit.toLocaleString()}`;
        document.getElementById('stat-profit').style.color = totalProfit >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';
        document.getElementById('stat-yield').innerText = totalInversion > 0 ? ((totalProfit / totalInversion) * 100).toFixed(2) + '%' : '0%';
        document.getElementById('stat-winrate').innerText = totalSettled > 0 ? ((wins / totalSettled) * 100).toFixed(1) + '%' : '0%';
        document.getElementById('stat-edge').innerText = totalSettled > 0 ? ((totalEdge / totalSettled) * 100).toFixed(2) + '%' : '0.00%';
        document.getElementById('stat-ev').innerText = `$${totalEV.toFixed(2)}`;

        renderChart(chartLabels, chartData);
        generateInsights(processedBets);
    }

    // --- INSIGHTS ENGINE ---
    function generateInsights(processedBets) {
        const container = document.getElementById('insights-container');
        container.innerHTML = '';
        
        const marketStats = {};
        processedBets.filter(b => b.result !== 'Pending').forEach(b => {
            if(!marketStats[b.market]) marketStats[b.market] = { p: 0, count: 0 };
            marketStats[b.market].p += b.profit;
            marketStats[b.market].count++;
        });

        for (let m in marketStats) {
            if(marketStats[m].p < 0 && marketStats[m].count > 2) {
                container.innerHTML += `<div class="insight-box insight-alert"><i class="fa fa-warning"></i> Cuidado: El mercado ${m} tiene pérdidas acumuladas.</div>`;
            }
            if(marketStats[m].p > (parseFloat(document.getElementById('config-bank').value) * 0.1)) {
                container.innerHTML += `<div class="insight-box insight-fire"><i class="fa fa-fire"></i> ¡Dominando ${m}! Es tu mercado más rentable.</div>`;
            }
        }
    }

    // --- CHART ENGINE ---
    function renderChart(labels, data) {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if(myChart) myChart.destroy();
        
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Bankroll',
                    data: data,
                    borderColor: '#007aff',
                    backgroundColor: 'rgba(0, 122, 255, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { grid: { color: '#232d3b' }, ticks: { color: '#8892b0' } },
                    x: { grid: { display: false }, ticks: { color: '#8892b0' } }
                }
            }
        });
    }

    // --- UTILS ---
    function backupData() {
        const blob = new Blob([JSON.stringify(bets)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup_quant_${Date.now()}.json`;
        a.click();
    }

    function exportCSV() {
        let csv = "Fecha,Partido,Liga,Mercado,Cuota,Stake,Edge,EV,Resultado\n";
        bets.forEach(b => {
            csv += `${b.date},${b.match},${b.league},${b.market},${b.odds},${b.stakeVal},${b.prob},${b.result}\n`;
        });
        const blob = new Blob([csv], {type: 'text/csv'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'operaciones_quant.csv';
        a.click();
    }

    function clearAll() {
        if(confirm("¿Estás seguro de borrar todos los datos? Esta acción es irreversible.")) {
            bets = [];
            saveAndRefresh();
        }
    }

    // Init
    window.onload = updateSystem;
</script>
</body>
</html>
